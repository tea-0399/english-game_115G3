                oninput="state.studentCodeInput = this.value.replace(/\\D/g, '')"
                onkeydown="if(event.key==='Enter') loginWithFiveDigitCode()"
              />
              ${state.studentLoginError ? `
                <div style="color:var(--pink-dark); font-weight:800; margin-top:10px; font-size:0.95rem;">
                  ${state.studentLoginError}
                </div>
              ` : ""}
              <div style="margin-top:14px;">
                <button class="btn btn-primary" style="font-size:1.15rem; padding:12px 28px;" onclick="loginWithFiveDigitCode()">
                  ✅ 確認學號並開始
                </button>
              </div>
            </div>
          </section>
        `;
      }

      // 第二步：學號登入成功後，選擇小偵探角色進入任務大廳
      const classSeatLabel = formatFiveDigitClassSeat(state.currentStudent.code);
      return `
        <section class="card hero-banner">
          <div style="display:inline-flex; align-items:center; gap:8px; background:var(--mint-soft); border:2px solid var(--mint-main); color:#135740; padding:6px 14px; border-radius:999px; font-weight:800; margin-bottom:8px;">
            <span>🎒 已登入：${state.currentStudent.code}（${classSeatLabel}${state.currentStudent.name ? " " + state.currentStudent.name : ""}）</span>
            <button style="background:#ffffff; border:1.5px solid var(--mint-main); border-radius:999px; padding:2px 8px; font-size:0.8rem; font-weight:800; cursor:pointer;" onclick="logoutStudent()">切換學號</button>
          </div>
          <h1 class="game-title">Stationery Detective 2.0</h1>
          <div class="game-subtitle">My Little School Life｜國小三年級英語互動與口說闖關</div>
          <div class="story-box">
            🏫 <strong>小偵探任務故事：</strong><br>
            開學第一天，教室裡的文具和新生資料卡弄亂了！<br>
            快選一位小偵探夥伴，運用 <strong>自我介紹、年齡問答、文具單字 (a / an)</strong> 與 <strong>麥克風口說練習</strong>，完成 4 大任務！
          </div>

          <h2 style="font-size:1.25rem; color:var(--blue-dark); margin-bottom:4px;">
            👇 第一步：選擇你的小偵探夥伴（同時設定你的 AI 示範聲線）
          </h2>
          <p style="margin:0 0 10px; font-size:0.95rem; font-weight:700; color:var(--text-muted);">
            目前選擇：<strong>${selectedDetective.zh}</strong>（<span class="voice-tag ${selectedDetective.gender}">${selectedDetective.voiceLabel}</span>）
          </p>
          <div class="avatar-grid">
            ${DETECTIVES.map(d => `
              <div class="avatar-card ${state.avatar === d.id ? "selected" : ""}" onclick="selectAvatar('${d.id}')">
                ${getDetectiveSVG(d.id, 96)}
                <div class="avatar-name-zh">${d.zh}</div>
                <div class="avatar-name-en">${d.en}</div>
                <div style="margin-top:6px;">
                  <span class="voice-tag ${d.gender}">🔊 ${d.voiceLabel}</span>
                </div>
              </div>
            `).join("")}
          </div>

          <button class="btn btn-primary" style="font-size:1.25rem; padding:14px 36px;" onclick="goToHub()">
            🚀 Start Game 開始偵探任務！
          </button>
        </section>
      `;
    }

    function selectAvatar(id) {
      playTone("click");
      state.avatar = id;
      const d = DETECTIVES.find(x => x.id === id);
      if (d) speakEnglish(`Hello! I'm ${d.en}.`, d.gender);
      render();
    }

    function renderHubScreen() {
      const detective = DETECTIVES.find(d => d.id === state.avatar) || DETECTIVES[0];
      const completedCount = Object.values(state.completedMissions).filter(Boolean).length;

      return `
        <section class="card hub-header">
          <div class="hub-detective-info">
            ${getDetectiveSVG(detective.id, 84)}
            <div>
              <div style="font-size:0.9rem; font-weight:800; color:var(--blue-dark);">
                任務大廳｜已完成 ${completedCount} / 4 個任務
              </div>
              <h2 style="margin:4px 0; font-size:1.4rem;">你好，${detective.zh}！</h2>
              <div style="font-size:0.95rem; color:var(--text-muted); font-weight:700;">
                集滿遊戲星星與口說練習星星，挑戰最後的「自我介紹舞台」吧！
              </div>
            </div>
          </div>
          <button class="btn btn-pink" onclick="goToFinalIntro()">
            🎤 自我介紹舞台 ${completedCount === 4 ? "(已解鎖推薦！)" : ""}
          </button>
        </section>

        <section class="card">
          <h3 style="margin:0 0 4px; font-size:1.2rem; color:var(--blue-dark);">🏅 我的小偵探徽章庫</h3>
          <div class="badges-bar">
            ${BADGES.map(b => {
              const earned = state.completedMissions[b.id];
              return `
                <div class="badge-slot ${earned ? "earned" : ""}">
                  <div style="font-size:2rem;">${earned ? b.icon : "🔒"}</div>
                  <div style="font-weight:800; font-size:0.95rem; margin-top:4px;">${b.zh}</div>
                  <div style="font-size:0.8rem; font-weight:700; color:var(--blue-dark);">${b.name}</div>
                </div>
              `;
            }).join("")}
          </div>
        </section>

        <section class="missions-grid">
          ${[1, 2, 3, 4].map(id => {
            const m = MISSIONS[id];
            const done = state.completedMissions[id];
            return `
              <div class="mission-card ${done ? "completed" : ""}">
                <div>
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;">
                    <span class="mission-tag" style="background:${m.color}; color:var(--text-main);">
                      ${done ? "✅ 已完成任務" : "🔍 偵探任務 " + id}
                    </span>
                    <span style="font-weight:800; color:#8a5a00;">⭐ ${state.missionStars[id]} 顆</span>
                  </div>
                  <h3 style="margin:4px 0; font-size:1.22rem; color:var(--blue-dark);">${m.titleEn}</h3>
                  <div style="font-weight:800; font-size:1.05rem; margin-bottom:6px;">${m.titleZh}</div>
                  <p style="margin:0; font-size:0.95rem; color:var(--text-muted); line-height:1.5; font-weight:600;">
                    ${m.descZh}
                  </p>
                </div>
                <button class="btn ${done ? "btn-mint" : "btn-primary"}" style="width:100%;" onclick="startMission(${id})">
                  ${done ? "🔄 再玩一次 + 口說練習" : "▶️ 進入任務"}
                </button>
              </div>
            `;
          }).join("")}
        </section>
      `;
    }

    function renderMissionScreen() {
      const m = MISSIONS[state.currentMission];
      const step = getCurrentStep();
      const totalSteps = m.steps.length;
      const pct = Math.round(((state.stepIndex + 1) / totalSteps) * 100);

      let stepBodyHtml = "";
      if (step.type === "explore_characters") {
        stepBodyHtml = renderExploreCharactersStep(step);
      } else if (step.type === "explore_ages") {
        stepBodyHtml = renderExploreAgesStep(step);
      } else if (step.type === "mystery_box") {
        stepBodyHtml = renderMysteryBoxStep(step);
      } else if (step.type === "match") {
        stepBodyHtml = renderMatchStep(step);
      } else if (step.type === "order_dialogue") {
        stepBodyHtml = renderOrderDialogueStep(step);
      } else if (step.type === "speaking_practice") {
        stepBodyHtml = renderSpeakingPracticeStep(step);
      } else if (step.type === "mcq") {
        stepBodyHtml = renderMCQStep(step);
      }

      return `
        <section class="card">
          <div class="progress-wrap">
            <div class="progress-meta">
              <span>${m.titleEn}（${m.titleZh}）</span>
              <span>第 ${state.stepIndex + 1} / ${totalSteps} 關</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%;"></div>
            </div>
          </div>

          <div class="activity-badge">${step.badge}</div>
          <div class="instruction-zh">${step.instructionZh}</div>

          ${stepBodyHtml}
        </section>
      `;
    }

    function renderExploreCharactersStep(step) {
      const allVisited = step.characters.every(c => state.visitedCards[`${state.currentMission}_char_${c.name}`]);
      return `
        <div class="explore-grid">
          ${step.characters.map(c => {
            const visited = !!state.visitedCards[`${state.currentMission}_char_${c.name}`];
            const g = FRIEND_GENDER[c.name] || "female";
            return `
              <div class="explore-card ${visited ? "visited" : ""}" onclick="visitCharacterCard('${c.name}', '${c.line.replace(/'/g, "\\'")}', '${g}')">
                ${getFriendSVG(c.name, 96)}
                <div style="margin-top:6px;">
                  <span class="voice-tag ${g}">${g === "female" ? "👧 女生聲線" : "👦 男生聲線"}</span>
                </div>
                <div style="font-size:1.25rem; font-weight:900; color:var(--blue-dark); margin-top:6px;">${c.name}</div>
                <div style="font-size:1.05rem; font-weight:800; margin:6px 0;">"${c.line}"</div>
                <div class="audio-btn" style="margin-top:4px;">🔊 點擊聽發音</div>
                <div style="margin-top:8px; font-size:0.88rem; font-weight:800; color:${visited ? "#165c45" : "#64748b"};">
                  ${visited ? "✅ 已認識 (+1⭐)" : "👆 點卡片認識他"}
                </div>
              </div>
            `;
          }).join("")}
        </div>
        <div style="text-align:center; margin-top:20px;">
          <button class="btn btn-mint" ${allVisited ? "" : "disabled"} onclick="goNextStep()">
            ${allVisited ? "🎉 全部認識了！前往下一關 ➡️" : "請先點擊全部 3 位新朋友喔！"}
          </button>
        </div>
      `;
    }

    function renderExploreAgesStep(step) {
      const allVisited = step.friends.every(f => state.visitedCards[`${state.currentMission}_char_${f.name}`]);
      return `
        <div class="explore-grid">
          ${step.friends.map(f => {
            const visited = !!state.visitedCards[`${state.currentMission}_char_${f.name}`];
            const g = FRIEND_GENDER[f.name] || "female";
            return `
              <div class="explore-card ${visited ? "visited" : ""}" onclick="visitCharacterCard('${f.name}', '${f.line.replace(/'/g, "\\'")}', '${g}')">
                ${getFriendSVG(f.name, 92)}
                <div style="margin-top:6px;">
                  <span class="voice-tag ${g}">${g === "female" ? "👧 女生聲線" : "👦 男生聲線"}</span>
                </div>
                <div style="display:inline-block; background:var(--yellow-soft); border:2px solid var(--yellow-main); border-radius:999px; padding:2px 12px; font-weight:900; margin-top:6px;">
                  ${f.name}｜${f.ageText}
                </div>
                <div style="font-size:1.05rem; font-weight:800; margin:8px 0; color:var(--blue-dark);">"${f.line}"</div>
                <div class="audio-btn">🔊 點擊聽發音</div>
                <div style="margin-top:8px; font-size:0.88rem; font-weight:800; color:${visited ? "#165c45" : "#64748b"};">
                  ${visited ? "✅ 已聽過 (+1⭐)" : "👆 點卡片聽年齡"}
                </div>
              </div>
            `;
          }).join("")}
        </div>
        <div style="text-align:center; margin-top:20px;">
          <button class="btn btn-mint" ${allVisited ? "" : "disabled"} onclick="goNextStep()">
            ${allVisited ? "🎂 太棒了！進入年齡挑戰 ➡️" : "請先聽完 3 位朋友的年齡喔！"}
          </button>
        </div>
      `;
    }

    function renderMysteryBoxStep() {
      const item = STATIONERY_LIST[state.boxItemIndex];
      return `
        <div class="question-box mystery-stage">
          <div style="font-weight:800; color:var(--blue-dark);">
            文具尋寶進度：第 ${state.boxItemIndex + 1} / ${STATIONERY_LIST.length} 件文具
          </div>

          <div class="box-container" onclick="openMysteryBox()">
            ${getMysteryBoxSVG(state.boxOpened)}
          </div>

          ${!state.boxOpened ? `
            <button class="btn btn-yellow" onclick="openMysteryBox()">
              ✨ 點擊打開神祕箱！
            </button>
          ` : `
            <div class="item-reveal">
              ${getStationerySVG(item.key, 126)}
              <div style="font-size:1.65rem; font-weight:900; color:var(--blue-dark); margin-top:6px;">
                ${item.phrase}
              </div>
              <div style="font-size:1.25rem; font-weight:800; color:var(--pink-dark); margin:4px 0;">
                "${item.sentence}"
              </div>
              <div style="font-size:0.98rem; font-weight:700; color:var(--text-muted); margin-bottom:10px;">
                ${item.zh}
              </div>
              <button class="audio-btn" onclick="speakEnglish('${item.sentence.replace(/'/g, "\\'")}', 'auto')">
                🔊 再聽一次發音
              </button>
            </div>
            <button class="btn btn-mint" style="margin-top:8px;" onclick="nextBoxItem()">
              ${state.boxItemIndex < STATIONERY_LIST.length - 1 ? "📦 找下一件文具 ➡️" : "🎉 6 件文具全找到了！開始挑戰 ➡️"}
            </button>
          `}
        </div>
      `;
    }

    function renderMatchStep(step) {
      const allMatched = state.matchState.matchedIds.length === step.pairs.length;
      const rightKey = `${step.id}_right_pairs`;
      if (state.shuffledRightPairsKey !== rightKey) {
        state.shuffledRightPairs = shuffleArray(step.pairs);
        state.shuffledRightPairsKey = rightKey;
      }
      const rightOrder = state.shuffledRightPairs;

      return `
        <div class="question-box">
          <div class="match-columns">
            <div class="match-col">
              <div style="font-weight:800; color:var(--blue-dark);">1️⃣ 先點左邊問句 / 提示</div>
              ${step.pairs.map(p => {
                const isMatched = state.matchState.matchedIds.includes(p.id);
                const isSelected = state.matchState.selectedLeft === p.id;
                return `
                  <div class="match-tile ${isMatched ? "matched" : ""} ${isSelected ? "selected" : ""}"
                       onclick="selectMatchLeft('${p.id}')">
                    ${isMatched ? "✅ " : ""}${p.left}
                  </div>
                `;
              }).join("")}
            </div>

            <div class="match-col">
              <div style="font-weight:800; color:var(--pink-dark);">2️⃣ 再點右邊正確回答</div>
              ${rightOrder.map(p => {
                const isMatched = state.matchState.matchedIds.includes(p.id);
                const isErr = state.matchState.errorPair === p.id;
                return `
                  <div class="match-tile ${isMatched ? "matched" : ""}"
                       style="${isErr ? "border-color:var(--pink-main); background:var(--pink-soft);" : ""}"
                       onclick="selectMatchRight('${p.id}', '${p.right.replace(/'/g, "\\'")}', '${p.gender || "auto"}')">
                    ${isMatched ? "✅ " : "🔊 "}${p.right}
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          ${state.matchState.errorPair ? `
            <div class="feedback-box retry" style="width:100%;">
              💡 再想一想喔！看看左邊是在問名字（What's your name?）、說名字（I'm...），還是打招呼（Nice to meet you!）？
            </div>
          ` : ""}
        </div>

        <div style="text-align:center;">
          <button class="btn btn-mint" ${allMatched ? "" : "disabled"} onclick="goNextStep()">
            ${allMatched ? "🌟 全部配對成功！前往口說練習挑戰 ➡️" : "請完成全部 3 組配對喔！"}
          </button>
        </div>
      `;
    }

    function renderOrderDialogueStep(step) {
      const allFilled = state.orderSlots.every(x => x !== null);
      const isCorrect = state.orderChecked && step.correctLines.every((line, idx) => state.orderSlots[idx] === line);
      const orderKey = `${step.id}_order_bank`;
      if (state.shuffledDialogueKey !== orderKey) {
        state.shuffledDialogueLines = shuffleArray(step.shuffledLines);
        state.shuffledDialogueKey = orderKey;
      }
      const bankLines = state.shuffledDialogueLines;

      return `
        <div class="question-box">
          <div style="font-weight:800; color:var(--blue-dark);">👇 對話順序區（點擊已填入的句子可取消）</div>
          <div class="order-slots">
            ${state.orderSlots.map((val, idx) => `
              <div class="order-slot ${val ? "filled" : ""}" onclick="clearOrderSlot(${idx})">
                <span class="slot-num">${idx + 1}</span>
                <span>${val ? val : "請從下方點選第 " + (idx + 1) + " 句對話..."}</span>
              </div>
            `).join("")}
          </div>

          <div style="font-weight:800; color:var(--text-muted); margin-bottom:6px;">🔤 句子選項庫（點擊放入空格）：</div>
          <div class="word-bank">
            ${bankLines.map(line => {
              const used = state.orderSlots.includes(line);
              return `
                <button class="bank-chip" ${used ? "disabled" : ""} onclick="pickOrderLine('${line.replace(/'/g, "\\'")}')">
                  ${line}
                </button>
              `;
            }).join("")}
          </div>

          ${allFilled && !isCorrect ? `
            <button class="btn btn-primary" style="margin-top:14px;" onclick="checkDialogueOrder()">
              🔍 檢查對話順序
            </button>
          ` : ""}

          ${state.orderChecked && !isCorrect ? `
            <div class="feedback-box retry" style="width:100%;">
              💡 順序還差一點點喔！提示：先問名字（What's your name?）→ 回答名字 → 再問幾歲（How old are you?）→ 回答幾歲。點擊上方空格可以重排！
            </div>
          ` : ""}

          ${isCorrect ? `
            <div class="feedback-box success" style="width:100%;">
              🎉 太厲害了！對話順序完全正確！<br>
              <span style="font-size:0.95rem;">${step.zhMeaning}</span>
            </div>
          ` : ""}
        </div>

        <div style="text-align:center;">
          <button class="btn btn-mint" ${isCorrect ? "" : "disabled"} onclick="goNextStep()">
            ${isCorrect ? "➡️ 繼續下一關" : "排好正確順序後即可過關"}
          </button>
        </div>
      `;
    }

    function renderMCQStep(step) {
      let visualHtml = "";

      if (step.visualType === "friend") {
        visualHtml = `<div>${getFriendSVG(step.visualValue, 108)}</div>`;
      } else if (step.visualType === "profile" || step.visualType === "full_profile") {
        const p = step.profile;
        visualHtml = `
          <div class="profile-card">
            ${getFriendSVG(p.friend, 94)}
            <div class="profile-details">
              ${p.rows.map(r => `
                <div class="profile-row">
                  <span class="profile-label">${r.label}</span>
                  <span>${r.value}</span>
                </div>
              `).join("")}
            </div>
            ${p.item ? `<div>${getStationerySVG(p.item, 90)}</div>` : ""}
          </div>
        `;
      } else if (step.visualType === "stationery") {
        visualHtml = `<div>${getStationerySVG(step.visualValue, 126)}</div>`;
      } else if (step.visualType === "near_far") {
        visualHtml = getNearFarSceneSVG(step.nearItem, step.farItem, step.target);
      } else if (step.visualType === "dialogue_bubble") {
        visualHtml = `
          <div style="display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;">
            ${getStationerySVG(step.item, 104)}
            <div class="chat-bubble" style="font-size:1.25rem;">${step.speakerA}</div>
          </div>
        `;
      } else if (step.visualType === "mini_chat") {
        const isStep2 = step.chatStep === 2;
        visualHtml = `
          <div class="chat-list">
            <div class="chat-row">
              ${getDetectiveSVG(state.avatar, 54)}
              <div class="chat-bubble">Detective: Hello! What's your name?</div>
            </div>
            <div class="chat-row right">
              ${getFriendSVG("Ben", 54)}
              <div class="chat-bubble">
                Ben: ${isStep2 ? "✅ My name is Ben." : "<span style='color:var(--pink-dark);'>[ 1 ] ____________</span>"}
              </div>
            </div>
            ${isStep2 ? `
              <div class="chat-row">
                ${getDetectiveSVG(state.avatar, 54)}
                <div class="chat-bubble" style="display:flex; align-items:center; gap:8px;">
                  <span>Detective: What's this?</span>
                  ${getStationerySVG("eraser", 54)}
                </div>
              </div>
              <div class="chat-row right">
                ${getFriendSVG("Ben", 54)}
                <div class="chat-bubble">
                  Ben: <span style="color:var(--pink-dark);">[ 2 ] ____________</span>
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }

      // 產生隨機洗牌後的選項順序（避免固定都是第一個選項正確）
      const stepOptionKey = `${state.currentMission}_${state.stepIndex}_${step.id || "mcq"}`;
      if (state.shuffledOptionStepKey !== stepOptionKey) {
        state.shuffledOptions = shuffleArray(step.options.map((text, origIdx) => ({ text, origIdx })));
        state.shuffledOptionStepKey = stepOptionKey;
      }
      const displayOptions = state.shuffledOptions;

      return `
        <div class="question-box">
          ${visualHtml}
          <h3 class="english-prompt">${step.promptEn}</h3>
          <button class="audio-btn" onclick="speakEnglish('${step.promptEn.replace(/\[.*?\]|______/g, "").replace(/'/g, "\\'")}', '${step.voiceGender || "auto"}')">
            🔊 聽題目發音
          </button>

          <div class="options-grid three-col" style="margin-top:8px;">
            ${displayOptions.map((optObj) => {
              const origIdx = optObj.origIdx;
              let btnClass = "option-btn";
              if (state.questionAnswered) {
                if (origIdx === step.correctIndex && state.lastAnswerCorrect) {
                  btnClass += " correct";
                } else if (origIdx === state.selectedOptionIdx && !state.lastAnswerCorrect) {
                  btnClass += " wrong";
                }
              }
              return `
                <button class="${btnClass}" onclick="answerMCQ(${origIdx})">
                  ${optObj.text}
                </button>
              `;
            }).join("")}
          </div>

          ${state.questionAnswered && state.lastAnswerCorrect ? `
            <div class="feedback-box success" style="width:100%;">
              🌟 答對了！太棒了！<br>
              <span style="font-size:0.95rem;">${step.hintZh}</span>
            </div>
          ` : ""}

          ${state.questionAnswered && !state.lastAnswerCorrect ? `
            <div class="feedback-box retry" style="width:100%;">
              💛 再試一次喔！小提示：${step.hintZh}
            </div>
          ` : ""}
        </div>

        <div style="text-align:center;">
          <button class="btn btn-mint" ${state.lastAnswerCorrect ? "" : "disabled"} onclick="goNextStep()">
            ${state.lastAnswerCorrect ? "🎉 太棒了！前往下一關 ➡️" : "選出正確答案後繼續"}
          </button>
        </div>
      `;
    }

    /* ==========================================================================
       8. 關卡內麥克風口說練習活動模板 (Speaking Practice Studio)
       ========================================================================== */
    function renderSpeakingPracticeStep(step) {
      const lineObj = step.lines[state.speakingLineIdx] || step.lines[0];
      const lineKey = `${step.id}_${state.speakingLineIdx}`;
      const evalRes = state.speakingResultByLine[lineKey] || null;

      // 只要有完成至少一句語音辨識或自行練習，即可隨時前往過關
      const hasPracticedAny =
        Object.keys(state.speakingResultByLine).length > 0 ||
        Object.keys(state.speakingSelfPracticed).length > 0;

      const genderLabel = lineObj.gender === "female" ? "👧 女生聲線示範" : "👦 男生聲線示範";

      return `

                : state.speakingSelfPracticed[lk]
                ? " ✓"

              return `
                <button class="chip-btn ${state.speakingLineIdx === idx ? "active" : ""}" onclick="selectSpeakingLine(${idx})">

          <div class="speaking-target-card">

              ${getFriendSVG(lineObj.speaker, 56)}
              <span class="voice-tag ${lineObj.gender}">${lineObj.speaker}｜${genderLabel}</span>
            </div>
            <div class="speaking-en-text">“${lineObj.en}”</div>
            <div class="speaking-zh-text">${lineObj.zh}</div>
          </div>

          <!-- 操作按鈕列：聽示範發音 + 開始/停止錄音 -->
          <div style="display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:12px;">
            <button class="btn btn-outline" onclick="speakEnglish('${lineObj.en.replace(/'/g, "\\'")}', '${lineObj.gender}')">
              🔊 聽示範發音
            </button>

            ${isSpeechRecognitionSupported ? (
              !state.speakingRecording ? `
                <button class="btn btn-pink" onclick="startMissionSpeaking()">

              ` : `
                <button class="btn btn-red" onclick="stopCurrentRecordingByUser()">

          </div>

          <!-- 錄音中即時動態與辨識文字 -->
          ${state.speakingRecording ? `
            <div class="live-transcript-box">
              <div class="wave-bars">
                <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
              </div>
              <div style="font-weight:800; color:var(--pink-dark); font-size:1.05rem;">
                🎙️ 正在聆聽你的聲音... 請大聲念出上方英文句子！
              </div>
              <div style="margin-top:6px; font-size:0.98rem; font-weight:700; color:var(--blue-dark);">
                即時辨識文字：${state.speakingInterimText ? `“${state.speakingInterimText}”` : "（等待語音輸入中...）"}
              </div>

          ` : ""}

          <!-- 錯誤或未支援語音辨識提示 -->
          ${!isSpeechRecognitionSupported ? `

              你可以先按上方的 <strong>「🔊 聽示範發音」</strong> 跟著大聲朗讀 3 遍，再點下方按鈕完成自行練習！
              <div style="margin-top:10px; text-align:center;">
                <button class="btn btn-yellow" style="min-height:46px; font-size:0.98rem;" onclick="markSpeakingSelfPractice()">
                  ${isSelfDone ? "✅ 已完成自行朗讀練習！" : "🗣️ 我已跟著大聲朗讀完成！"}

              </div>
            </div>
          ` : ""}

          ${state.speakingErrorMsg ? `
            <div class="feedback-box error-alert" style="text-align:left;">
              ${state.speakingErrorMsg}

                <button class="chip-btn" style="margin-left:6px;" onclick="markSpeakingSelfPractice()">
                  ${isSelfDone ? "✅ 已標記完成" : "🗣️ 我已大聲跟讀練習"}

              </div>
            </div>

          ${evalRes ? `

                  <span class="score-grade-pill" style="background:${evalRes.gradeBg}; color:${evalRes.gradeColor};">
                    ${evalRes.gradeLabel}
                  </span>
                  <span style="margin-left:8px; font-weight:900; color:#8a5a00; font-size:1.05rem;">
                    口說獎勵：${evalRes.speakingStars > 0 ? "⭐".repeat(evalRes.speakingStars) + ` (+${evalRes.speakingStars} 口說星)` : "加油，70分以上可得口說星！"}
                  </span>
                </div>
                <div class="score-big-badge">
                  估算練習分數：${evalRes.finalPercentScore} 分
                </div>
              </div>

              <div style="font-size:0.96rem; line-height:1.65; margin-bottom:10px;">
                <div><strong>📘 標準句子：</strong><span style="color:var(--blue-dark); font-weight:800;">${evalRes.targetEn}</span></div>
                <div><strong>🗣️ 辨識結果：</strong><span style="color:var(--pink-dark); font-weight:800;">“${evalRes.spokenRaw}”</span></div>
              </div>

              <div class="score-breakdown-grid">
                <div class="breakdown-item">
                  <div class="breakdown-label">1. 句子符合度 (滿分 60)</div>
                  <div class="breakdown-val">${evalRes.accuracyScore} / 60 分</div>
                </div>
                <div class="breakdown-item">
                  <div class="breakdown-label">2. 句子完整度 (滿分 25)</div>
                  <div class="breakdown-val">${evalRes.completenessScore} / 25 分</div>
                </div>
                <div class="breakdown-item">
                  <div class="breakdown-label">3. 流暢度估算 (滿分 15)</div>
                  <div class="breakdown-val">${evalRes.fluencyText}</div>
                </div>
              </div>

              <div style="background:var(--mint-soft); border-radius:12px; padding:10px 12px; font-weight:700; color:#135740; font-size:0.95rem; line-height:1.55;">
                ${evalRes.feedbackTips.join("<br>")}
              </div>

              <div class="disclaimer-note">
                📌 <strong>評分說明：</strong>此分數為系統根據語音辨識文字與語音時間計算之<strong>練習參考估算</strong>（${evalRes.isPartialAssessment ? "本次因無足夠語音時間資訊，依句子符合度與完整度 85 分換算百分比" : "依符合度、完整度與流暢度計算"}），並非正式發音檢定。
              </div>
            </div>
          ` : ""}
        </div>

        <div style="text-align:center; margin-top:20px; display:flex; flex-wrap:wrap; gap:12px; justify-content:center;">
          ${state.speakingLineIdx < step.lines.length - 1 ? `
            <button class="btn btn-outline" onclick="selectSpeakingLine(${state.speakingLineIdx + 1})">
              ➡️ 練習下一句 (${state.speakingLineIdx + 2}/${step.lines.length})
            </button>
          ` : ""}

          <button class="btn btn-mint" onclick="goNextStep()">
            ${hasPracticedAny ? "🎉 完成口說練習，領取任務徽章！ ➡️" : "⏭️ 先跳過口說，完成本任務 ➡️"}
          </button>
        </div>
      `;
    }

    function renderMissionCompleteScreen() {
      const m = MISSIONS[state.currentMission];
      const badge = BADGES.find(b => b.id === state.currentMission);
      const detective = DETECTIVES.find(d => d.id === state.avatar) || DETECTIVES[0];
      const allFourDone = Object.values(state.completedMissions).every(Boolean);

      return `
        <section class="card" style="text-align:center; padding:30px 20px;">

          </p>

          <div style="display:inline-block; background:var(--yellow-soft); border:3px solid var(--yellow-main); border-radius:24px; padding:20px 32px; margin-bottom:20px;">
            <div style="font-size:3.2rem;">${badge.icon}</div>
            <div style="font-size:1.3rem; font-weight:900; color:#6b4700; margin-top:6px;">${badge.zh}</div>
            <div style="font-size:1rem; font-weight:800; color:var(--blue-dark);">${badge.name}</div>
          </div>

          <div style="display:flex; flex-wrap:wrap; gap:12px; justify-content:center;">
            <button class="btn btn-primary" onclick="goToHub()">
              🏫 回到任務大廳
            </button>
            ${allFourDone ? `
              <button class="btn btn-pink" onclick="goToFinalIntro()">
                🎤 前往最終自我介紹舞台！

    /* ==========================================================================
       9. 最終任務：自我介紹舞台 + 麥克風口說跟讀挑戰 (Final Speaking Stage)
       ========================================================================== */
    function getIntroSentences() {
      const itemObj = STATIONERY_LIST.find(x => x.key === state.introItem) || STATIONERY_LIST[0];
      return [
        { en: "Hello!", zh: "你好！" },
        { en: `My name is ${state.introName || "Amy"}.`, zh: `我的名字是 ${state.introName || "Amy"}。` },
        { en: `I'm ${state.introAge} years old.`, zh: `我今年 ${state.introAge === "eight" ? "8" : state.introAge === "nine" ? "9" : "10"} 歲。` },
        { en: `Look! ${itemObj.sentence}`, zh: `你看！${itemObj.zh.split("（")[0]}。` },
        { en: "Nice to meet you!", zh: "很高興認識你！" }
      ];
    }

    function updateIntroField(field, val) {
      stopActiveRecognition(true);
      playTone("click");
      if (field === "name") {
        const clean = val.replace(/[^a-zA-Z\s-]/g, "").slice(0, 14);
        state.introName = clean || "Amy";
      } else if (field === "age") {
        state.introAge = val;
      } else if (field === "item") {
        state.introItem = val;
      }
      state.introStep = 0;
      state.introRecording = false;
      state.introInterimText = "";
      state.introErrorMsg = "";
      state.introEvalResult = null;
      state.introFinished = false;
      render();
    }

    function playCurrentIntroLine() {
      const lines = getIntroSentences();
      const idx = Math.min(state.introStep, lines.length - 1);
      const d = DETECTIVES.find(x => x.id === state.avatar);
      speakEnglish(lines[idx].en, d ? d.gender : "auto");
    }

    function playFullIntroSpeech() {
      const lines = getIntroSentences();
      const fullText = lines.map(l => l.en).join(" ");
      const d = DETECTIVES.find(x => x.id === state.avatar);
      speakEnglish(fullText, d ? d.gender : "auto");
    }

    function nextIntroPracticeLine() {
      stopActiveRecognition(true);
      playTone("click");
      const lines = getIntroSentences();
      state.introRecording = false;
      state.introInterimText = "";
      state.introErrorMsg = "";
      state.introEvalResult = null;

      if (state.introStep < lines.length - 1) {
        state.introStep += 1;
        playCurrentIntroLine();
      } else {
        state.introStep = lines.length;
        state.introFinished = true;
        awardStar("final_intro_complete", null);
        playTone("fanfare");
      }
      render();
    }

    function startIntroSpeakingTest() {
      const lines = getIntroSentences();
      const isFullMode = state.introStep >= lines.length;
      const targetEn = isFullMode
        ? lines.map(l => l.en).join(" ")
        : lines[state.introStep].en;

      playTone("click");
      state.introErrorMsg = "";
      state.introInterimText = "";

      const lineKey = isFullMode ? "final_intro_full" : `final_intro_step_${state.introStep}`;

      beginSpeechSession({
        targetEn,
        onInterim: (text) => {
          state.introInterimText = text;
          render();
        },
        onFinalEvaluated: (evalResult) => {
          state.introEvalResult = evalResult;
          recordSpeakingStars(lineKey, evalResult.speakingStars);
          if (evalResult.finalPercentScore >= 70) {
            playTone("correct");
          } else {
            playTone("click");
          }
          render();
        },
        onError: (errMsg) => {
          state.introErrorMsg = errMsg;
          playTone("wrong");
          render();
        },
        onStateChange: (isRec) => {
          state.introRecording = isRec;
          render();
        }
      });
    }

    function renderFinalIntroScreen() {
      const detective = DETECTIVES.find(d => d.id === state.avatar) || DETECTIVES[0];
      const lines = getIntroSentences();
      const isAllShown = state.introStep >= lines.length;
      const currentLine = lines[Math.min(state.introStep, lines.length - 1)];
      const evalRes = state.introEvalResult;

      return `
        <section class="card stage-box">
          <div style="font-size:2.4rem;">🎤🌟🎤</div>
          <h2 style="font-size:1.7rem; color:var(--pink-dark); margin:4px 0;">

          <p style="font-size:1.02rem; font-weight:700; color:var(--text-muted); margin-bottom:16px;">

          </p>

          <!-- 步驟 1：自訂資料 -->
          <div style="background:#ffffff; border-radius:20px; padding:16px; border:2px solid var(--border-soft); margin-bottom:16px;">

                <button class="chip-btn ${state.introName === n ? "active" : ""}" onclick="updateIntroField('name', '${n}')">${n}</button>

              <input class="name-input" type="text" placeholder="或輸入英文名" value="${state.introName}" onchange="updateIntroField('name', this.value)" />
            </div>

            <div class="chip-group">

              <button class="chip-btn ${state.introAge === "nine" ? "active" : ""}" onclick="updateIntroField('age', 'nine')">9 歲 (nine)</button>
              <button class="chip-btn ${state.introAge === "ten" ? "active" : ""}" onclick="updateIntroField('age', 'ten')">10 歲 (ten)</button>
            </div>

            <div style="font-weight:800; color:var(--blue-dark);">3️⃣ 選擇你手上拿的文具：</div>
            <div class="chip-group">
              ${STATIONERY_LIST.map(it => `
                <button class="chip-btn ${state.introItem === it.key ? "active" : ""}" onclick="updateIntroField('item', '${it.key}')">
                  ${it.phrase}
                </button>
              `).join("")}
            </div>
          </div>

          <!-- 步驟 2：自我介紹舞台與口說錄音練習 -->
          <div class="speech-card">

              ${getDetectiveSVG(detective.id, 84)}
              ${getStationerySVG(state.introItem, 84)}
            </div>

            ${!isAllShown ? `
              <div style="font-size:0.95rem; font-weight:800; color:var(--pink-dark);">
                口說跟讀練習：第 ${state.introStep + 1} / ${lines.length} 句
              </div>
              <div class="speech-line">${currentLine.en}</div>
              <div style="font-size:1rem; font-weight:700; color:var(--text-muted); margin-bottom:14px;">
                ${currentLine.zh}
              </div>

              <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;">
                <button class="btn btn-outline" onclick="playCurrentIntroLine()">
                  🔊 聽示範發音
                </button>

                ${isSpeechRecognitionSupported ? (
                  !state.introRecording ? `
                    <button class="btn btn-pink" onclick="startIntroSpeakingTest()">
                      🎙️ ${evalRes ? "再試一次錄音" : "開始錄音"}
                    </button>
                  ` : `
                    <button class="btn btn-red" onclick="stopCurrentRecordingByUser()">
                      ⏹️ 停止錄音
                    </button>
                  `
                ) : ""}

                <button class="btn btn-mint" onclick="nextIntroPracticeLine()">
                  ${state.introStep < lines.length - 1 ? "➡️ 下一句" : "🎉 完成 5 句練習，看完整講稿！"}
                </button>
              </div>
            ` : `
              <div style="font-size:1.05rem; font-weight:900; color:#135740; margin-bottom:8px;">
                🌟 你的完整英文自我介紹講稿（也可挑戰一次唸完 5 句喔！）：
              </div>
              <div style="background:#f4f9ff; border-radius:16px; padding:14px; text-align:left; margin-bottom:14px;">
                ${lines.map(l => `
                  <div style="margin-bottom:8px;">
                    <div style="font-size:1.25rem; font-weight:800; color:var(--blue-dark);">${l.en}</div>
                    <div style="font-size:0.9rem; font-weight:700; color:var(--text-muted);">${l.zh}</div>
                  </div>
                `).join("")}
              </div>

              <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;">
                <button class="btn btn-primary" onclick="playFullIntroSpeech()">
                  🔊 聽完整 5 句連貫朗讀
                </button>

                ${isSpeechRecognitionSupported ? (
                  !state.introRecording ? `
                    <button class="btn btn-pink" onclick="startIntroSpeakingTest()">
                      🎙️ 挑戰錄音朗讀完整 5 句！
                    </button>
                  ` : `
                    <button class="btn btn-red" onclick="stopCurrentRecordingByUser()">
                      ⏹️ 停止錄音
                    </button>
                  `
                ) : ""}

                <button class="btn btn-yellow" onclick="updateIntroField('name', state.introName)">
                  🔄 從第 1 句重新練習
                </button>
              </div>
            `}

            <!-- 自我介紹舞台：錄音中即時提示 -->
            ${state.introRecording ? `
              <div class="live-transcript-box">
                <div class="wave-bars">
                  <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                </div>
                <div style="font-weight:800; color:var(--pink-dark); font-size:1.02rem;">
                  🎙️ 正在聆聽你的自我介紹... 請大聲朗讀！
                </div>
                <div style="margin-top:6px; font-size:0.96rem; font-weight:700; color:var(--blue-dark);">
                  即時辨識文字：${state.introInterimText ? `“${state.introInterimText}”` : "（等待語音輸入中...）"}
                </div>
              </div>
            ` : ""}

            <!-- 自我介紹舞台：不支援語音辨識或錯誤提示 -->
            ${!isSpeechRecognitionSupported ? `
              <div class="feedback-box retry" style="text-align:left; margin-top:12px;">
                ℹ️ 目前瀏覽器不支援語音辨識功能，請先按 <strong>「🔊 聽示範發音」</strong> 跟著大聲朗讀練習，再按 <strong>「➡️ 下一句」</strong> 完成自我介紹！
              </div>
            ` : ""}

            ${state.introErrorMsg ? `
              <div class="feedback-box error-alert" style="text-align:left; margin-top:12px;">
                ${state.introErrorMsg}
              </div>
            ` : ""}

            <!-- 自我介紹舞台：估算評分結果 -->
            ${evalRes ? `
              <div class="transcript-result-card">
                <div class="score-header-row">
                  <div>
                    <span class="score-grade-pill" style="background:${evalRes.gradeBg}; color:${evalRes.gradeColor};">
                      ${evalRes.gradeLabel}
                    </span>
                    <span style="margin-left:8px; font-weight:900; color:#8a5a00; font-size:1rem;">
                      ${evalRes.speakingStars > 0 ? "⭐".repeat(evalRes.speakingStars) + ` (+${evalRes.speakingStars} 口說星)` : "再試一次挑戰 70 分以上可得口說星！"}
                    </span>
                  </div>
                  <div class="score-big-badge">
                    估算練習分數：${evalRes.finalPercentScore} 分
                  </div>
                </div>

                <div style="font-size:0.94rem; line-height:1.6; margin-bottom:10px;">
                  <div><strong>📘 標準句子：</strong><span style="color:var(--blue-dark); font-weight:800;">${evalRes.targetEn}</span></div>
                  <div><strong>🗣️ 辨識結果：</strong><span style="color:var(--pink-dark); font-weight:800;">“${evalRes.spokenRaw}”</span></div>
                </div>

                <div class="score-breakdown-grid">
                  <div class="breakdown-item">
                    <div class="breakdown-label">1. 句子符合度 (60分)</div>
                    <div class="breakdown-val">${evalRes.accuracyScore} / 60 分</div>
                  </div>
                  <div class="breakdown-item">
                    <div class="breakdown-label">2. 句子完整度 (25分)</div>
                    <div class="breakdown-val">${evalRes.completenessScore} / 25 分</div>
                  </div>
                  <div class="breakdown-item">
                    <div class="breakdown-label">3. 流暢度估算 (15分)</div>
                    <div class="breakdown-val">${evalRes.fluencyText}</div>
                  </div>
                </div>

                <div style="background:var(--mint-soft); border-radius:12px; padding:10px 12px; font-weight:700; color:#135740; font-size:0.94rem;">
                  ${evalRes.feedbackTips.join("<br>")}
                </div>

                <div class="disclaimer-note">
                  📌 <strong>評分說明：</strong>此分數為系統根據語音辨識文字與語音時間計算之<strong>練習參考估算</strong>，並非正式發音檢定。
                </div>
              </div>
            ` : ""}
          </div>

          ${state.introFinished ? `
            <div class="feedback-box success" style="max-width:640px; margin:16px auto 0;">
              🏆 <strong>恭喜你成為超級小偵探！</strong><br>
              你目前共獲得 <strong>⭐ ${state.stars} / 26 顆遊戲星星</strong> 與 <strong>🎙️ ${state.speakingStarsTotal} 顆口說練習星星</strong>！
            </div>
          ` : ""}
        </section>
      `;
    }

    // 啟動遊戲（先檢查課堂 QR Code 存取時效）
    initAccessControlFromURL();
    render();
  </script>
</body>
</html>
