            <div style="font-weight:800; font-size:0.95rem; color:var(--text-main); margin-top:4px;">${b.name}</div>
            <div style="font-size:0.82rem; font-weight:700; color:var(--text-muted);">${b.zh}</div>
          </div>
        `;
      }).join("");

      return `
        <section class="card hub-header">
          <div class="hub-detective-info">
            ${getDetectiveSVG(state.avatar, 84)}
            <div>
              <div style="font-size:0.9rem; font-weight:800; color:var(--blue-dark);">歡迎回來，${detectiveObj.zh}！</div>
              <h2 style="margin:2px 0; font-size:1.4rem;">校園偵探任務大廳</h2>
              <div style="font-size:0.95rem; color:var(--text-muted); font-weight:700;">
                完成四大任務後，就能解鎖「我的英語自我介紹」最終舞台！
              </div>
            </div>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-yellow" onclick="openFinalStage()">
              🎤 最終自我介紹舞台
            </button>
          </div>
        </section>

        ${allFourDone ? `
          <section class="card" style="background:linear-gradient(135deg, #fff5f8 0%, #fffbe6 100%); border-color:var(--pink-main); text-align:center;">
            <h2 style="margin:0 0 6px; color:var(--pink-dark);">🎉 太厲害了！四大任務全部完成！</h2>
            <p style="margin:0 0 14px; font-weight:700;">快進入最終口說舞台，完成「My Little Introduction 我的英語自我介紹」領取最高榮譽吧！</p>
            <button class="btn btn-pink" onclick="openFinalStage()">🌟 進入最終任務 My Little Introduction</button>
          </section>
        ` : ""}

        <div class="missions-grid">${missionCards}</div>

        <section class="card" style="margin-top:18px;">
          <h3 style="margin:0 0 4px; font-size:1.15rem; color:var(--blue-dark);">🏅 我的偵探徽章收集冊</h3>
          <div style="font-size:0.9rem; color:var(--text-muted); font-weight:700;">每完成一個任務就能點亮一枚專屬徽章！</div>
          <div class="badges-bar">${badgesHtml}</div>
          <div style="margin-top:16px; text-align:right;">
            <button class="nav-btn" onclick="fullResetGame()">🔄 全部重新開始</button>
          </div>
        </section>
      `;
    }

    // --------------------------------------------------------------------------
    // 畫面 3：關卡進行中 (Mission Steps)
    // --------------------------------------------------------------------------
    function renderMissionScreen() {
      const m = MISSIONS[state.currentMission];
      const step = m.steps[state.stepIndex];
      const pct = Math.round(((state.stepIndex + 1) / m.steps.length) * 100);

      let bodyHtml = "";
      if (step.type === "explore_characters") {
        bodyHtml = renderExploreCharacters(step);
      } else if (step.type === "explore_ages") {
        bodyHtml = renderExploreAges(step);
      } else if (step.type === "mystery_box") {
        bodyHtml = renderMysteryBox(step);
      } else if (step.type === "match") {
        bodyHtml = renderMatchActivity(step);
      } else if (step.type === "order_dialogue") {
        bodyHtml = renderOrderDialogue(step);
      } else if (step.type === "speaking_practice") {
        bodyHtml = renderSpeakingPracticeActivity(step);
      } else if (step.type === "mcq") {
        bodyHtml = renderMCQActivity(step);
      }

      return `
        <section class="card">
          <div class="progress-wrap">
            <div class="progress-meta">
              <span>${m.titleEn}｜${m.titleZh}</span>
              <span>進度：第 ${state.stepIndex + 1} / ${m.steps.length} 關</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%;"></div>
            </div>
          </div>

          <div class="activity-badge">${step.badge}</div>
          <div class="instruction-zh">${step.instructionZh}</div>

          ${bodyHtml}
        </section>
      `;
    }

    function renderExploreCharacters(step) {
      const visitedCount = step.characters.filter(c => state.visitedCards[c.name]).length;
      const allVisited = visitedCount === step.characters.length;

      const cards = step.characters.map(c => {
        const visited = !!state.visitedCards[c.name];
        const g = FRIEND_GENDER[c.name] || "female";
        return `
          <div class="explore-card ${visited ? "visited" : ""}" onclick="visitCharacterCard('${c.name}', '${c.line.replace(/'/g, "\\'")}', '${g}')">
            ${getFriendSVG(c.name, 96)}
            <div style="margin-top:6px;">
              <span class="voice-tag ${g}">${g === "female" ? "👧 女生發音" : "👦 男生發音"}</span>
            </div>
            <div style="margin-top:6px; font-weight:800; font-size:1.15rem; color:var(--blue-dark);">Name: ${c.name}</div>
            <div style="margin:6px 0; font-weight:700; color:var(--text-main); font-size:1rem;">"${c.line}"</div>
            <span class="audio-btn" style="margin-top:4px;">🔊 聽發音</span>
            <div style="margin-top:6px; font-size:0.85rem; font-weight:800; color:${visited ? 'var(--mint-dark)' : 'var(--text-muted)'};">
              ${visited ? "✅ 已認識" : "👆 點擊認識"}
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="explore-grid">${cards}</div>
        <div style="text-align:center; margin-top:20px;">
          <button class="btn btn-primary" ${allVisited ? "" : "disabled"} onclick="nextStep()">
            ${allVisited ? "下一步：開始答題挑戰 ➡" : `請先點擊全部角色卡片 (${visitedCount}/${step.characters.length})`}
          </button>
        </div>
      `;
    }

    function renderExploreAges(step) {
      const visitedCount = step.friends.filter(f => state.visitedCards["age_" + f.name]).length;
      const allVisited = visitedCount === step.friends.length;

      const cards = step.friends.map(f => {
        const visited = !!state.visitedCards["age_" + f.name];
        const g = FRIEND_GENDER[f.name] || "female";
        return `
          <div class="explore-card ${visited ? "visited" : ""}" onclick="visitAgeCard('${f.name}', '${f.line.replace(/'/g, "\\'")}', '${g}')">
            ${getFriendSVG(f.name, 92)}
            <div style="margin-top:4px;">
              <span class="voice-tag ${g}">${g === "female" ? "👧 女生發音" : "👦 男生發音"}</span>
            </div>
            <div style="margin-top:6px; font-weight:800; font-size:1.15rem; color:var(--blue-dark);">${f.name}</div>
            <div style="display:inline-block; background:var(--yellow-soft); border:2px solid var(--yellow-main); padding:2px 12px; border-radius:999px; font-weight:800; color:var(--yellow-dark); margin:4px 0;">
              🎂 ${f.ageText}
            </div>
            <div style="margin:6px 0; font-weight:700; color:var(--text-main);">"${f.line}"</div>
            <span class="audio-btn">🔊 聽發音</span>
          </div>
        `;
      }).join("");

      return `
        <div class="explore-grid">${cards}</div>
        <div style="text-align:center; margin-top:20px;">
          <button class="btn btn-primary" ${allVisited ? "" : "disabled"} onclick="nextStep()">
            ${allVisited ? "下一步：年齡問答挑戰 ➡" : `請先點擊全部朋友卡片 (${visitedCount}/${step.friends.length})`}
          </button>
        </div>
      `;
    }

    function renderMysteryBox(step) {
      const currentItem = STATIONERY_LIST[state.boxItemIndex];
      const foundCount = STATIONERY_LIST.filter(s => state.visitedCards["box_" + s.key]).length;
      const allFound = foundCount === STATIONERY_LIST.length;

      return `
        <div class="question-box">
          <div class="mystery-stage">
            <div style="font-weight:800; color:var(--blue-dark);">
              已發現文具：${foundCount} / ${STATIONERY_LIST.length} 種
            </div>

            ${state.boxOpened ? `
              <div class="item-reveal">
                ${getStationerySVG(currentItem.key, 128)}
                <div style="font-size:1.5rem; font-weight:900; color:var(--blue-dark); margin-top:6px;">
                  ${currentItem.phrase}
                </div>
                <div style="font-size:1.1rem; font-weight:800; color:var(--mint-dark);">
                  "${currentItem.sentence}"
                </div>
                <div style="font-size:0.95rem; color:var(--text-muted); font-weight:700; margin:4px 0 10px;">
                  ${currentItem.zh}
                </div>
                <button class="audio-btn" onclick="speakEnglish('${currentItem.sentence.replace(/'/g, "\\'")}', 'auto')">🔊 再聽一次發音</button>
              </div>
            ` : `
              <div class="box-container" onclick="openNextBoxItem()">
                ${getMysteryBoxSVG(false)}
                <div style="font-weight:800; color:var(--pink-dark); margin-top:6px;">👆 點擊神祕箱打開看看！</div>
              </div>
            `}

            <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px;">
              <button class="btn btn-yellow" onclick="openNextBoxItem()">
                🎁 ${state.boxOpened ? "打開下一個神祕箱" : "打開神祕箱"}
              </button>
            </div>
          </div>
        </div>

        <div style="text-align:center;">
          <button class="btn btn-primary" ${allFound ? "" : "disabled"} onclick="nextStep()">
            ${allFound ? "全部文具都找到了！開始闖關 ➡" : `請打開箱子找出全部 6 種文具 (${foundCount}/6)`}
          </button>
        </div>
      `;
    }

    function renderMatchActivity(step) {
      const mState = state.matchState;
      const allMatched = mState.matchedIds.length === step.pairs.length;
      const stepKey = `${state.currentMission}_${state.stepIndex}_${step.id}`;
      if (!state.shuffledRightPairs || state.shuffledRightPairsKey !== stepKey) {
        state.shuffledRightPairs = shuffleArray(step.pairs);
        state.shuffledRightPairsKey = stepKey;
      }
      const rightOrder = state.shuffledRightPairs;

      const leftHtml = step.pairs.map(p => {
        const isMatched = mState.matchedIds.includes(p.id);
        const isSelected = mState.selectedLeft === p.id;
        return `
          <button class="match-tile ${isMatched ? "matched" : ""} ${isSelected ? "selected" : ""}"
            ${isMatched ? "disabled" : ""}
            onclick="selectMatchLeft('${p.id}', '${p.left.replace(/'/g, "\\'")}', 'auto')">
            ${isMatched ? "✅ " : ""}${p.left}
          </button>
        `;
      }).join("");

      const rightHtml = rightOrder.map(p => {
        const isMatched = mState.matchedIds.includes(p.id);
        return `
          <button class="match-tile ${isMatched ? "matched" : ""}"
            ${isMatched ? "disabled" : ""}
            onclick="selectMatchRight('${p.id}', '${p.right.replace(/'/g, "\\'")}', '${p.gender || "auto"}')">
            ${isMatched ? "✅ " : ""}${p.right}
          </button>
        `;
      }).join("");

      return `
        <div class="question-box">
          <div class="match-columns">
            <div class="match-col">
              <div style="font-weight:800; color:var(--blue-dark);">1. 點選左邊問題或提示</div>
              ${leftHtml}
            </div>
            <div class="match-col">
              <div style="font-weight:800; color:var(--mint-dark);">2. 點選右邊正確回答</div>
              ${rightHtml}
            </div>
          </div>
          ${mState.errorPair ? `
            <div class="feedback-box retry" style="width:100%;">
              💡 Good try! 這兩句意思配不起來喔，請再試試看！
            </div>
          ` : ""}
          ${allMatched ? `
            <div class="feedback-box success" style="width:100%;">
              🌟 <strong>Excellent! 全部配對成功！</strong> 獲得 1 顆星星 ⭐（記住：My name is... 和 I'm... 都是正確的自我介紹喔！）
            </div>
          ` : ""}
        </div>

        ${allMatched ? `
          <div style="text-align:center;">
            <button class="btn btn-primary" onclick="nextStep()">繼續下一關：口說練習 ➡</button>
          </div>
        ` : ""}
      `;
    }

    function renderOrderDialogue(step) {
      const slots = state.orderSlots;
      const allFilled = slots.every(s => s !== null);
      const isSolved = state.questionAnswered;
      const stepKey = `${state.currentMission}_${state.stepIndex}_${step.id}`;
      if (!state.shuffledDialogueLines || state.shuffledDialogueKey !== stepKey) {
        state.shuffledDialogueLines = shuffleArray(step.shuffledLines);
        state.shuffledDialogueKey = stepKey;
      }

      const slotsHtml = [0, 1, 2, 3].map(idx => {
        const val = slots[idx];
        return `
          <div class="order-slot ${val ? "filled" : ""}" onclick="removeOrderSlot(${idx})">
            <span class="slot-num">${idx + 1}</span>
            <span>${val ? val : "點擊下方句子放入第 " + (idx + 1) + " 句"}</span>
          </div>
        `;
      }).join("");

      const bankHtml = state.shuffledDialogueLines.map(line => {
        const used = slots.includes(line);
        return `
          <button class="bank-chip" ${used || isSolved ? "disabled" : ""} onclick="pickOrderLine('${line.replace(/'/g, "\\'")}')">
            ${line}
          </button>
        `;
      }).join("");

      return `
        <div class="question-box">
          <div class="order-slots">${slotsHtml}</div>
          <div class="word-bank">${bankHtml}</div>

          ${!isSolved ? `
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;">
              <button class="btn btn-outline" onclick="clearOrderSlots()">🔄 全部清空重排</button>
              <button class="btn btn-primary" ${allFilled ? "" : "disabled"} onclick="checkOrderDialogue()">
                ✅ 檢查對話順序
              </button>
            </div>
          ` : ""}

          ${state.orderChecked && !isSolved ? `
            <div class="feedback-box retry" style="width:100%;">
              💡 <strong>Good try!</strong> 提示：先問名字（What's your name?）→ 回答名字 → 再問幾歲（How old are you?）→ 回答年齡！
            </div>
          ` : ""}

          ${isSolved ? `
            <div class="feedback-box success" style="width:100%; text-align:left;">
              🌟 <strong>You're a star! 對話順序完全正確！</strong> 獲得 1 顆星星 ⭐<br/>
              <div style="margin-top:8px; background:#ffffff; padding:10px 14px; border-radius:12px;">
                <div>1. What's your name?</div>
                <div>2. My name is Tom.</div>
                <div>3. How old are you?</div>
                <div>4. I'm nine years old.</div>
                <div style="margin-top:6px; color:var(--blue-dark); font-size:0.95rem;">${step.zhMeaning}</div>
              </div>
              <div style="margin-top:10px; text-align:center;">
                <button class="audio-btn" onclick="speakEnglish('What is your name? My name is Tom. How old are you? I am nine years old.', 'male')">
                  🔊 聽完整對話朗讀
                </button>
              </div>
            </div>
          ` : ""}
        </div>

        ${isSolved ? `
          <div style="text-align:center;">
            <button class="btn btn-primary" onclick="nextStep()">繼續下一題 ➡</button>
          </div>
        ` : ""}
      `;
    }

    // --------------------------------------------------------------------------
    // 評分結果卡片產生器 (共用元件：供關卡口說練習與最終自我介紹舞台顯示)
    // --------------------------------------------------------------------------
    function renderEvaluationResultCard(evalRes, retryOnClickStr) {
      if (!evalRes || !evalRes.hasValidSpeech) return "";

      const starIcons = evalRes.speakingStars > 0
        ? "⭐".repeat(evalRes.speakingStars) + `（獲得 ${evalRes.speakingStars} 顆口說練習星星）`
        : "尚未獲得口說練習星星（70 分以上可獲得 1～3 顆口說星星）";

      return `
        <div class="transcript-result-card">
          <div style="font-size:0.9rem; font-weight:800; color:var(--text-muted); margin-bottom:4px;">
            🗣️ 語音辨識結果（你說出的英文）：
          </div>
          <div style="background:#f3f8ff; border:2px solid #cbe0fa; border-radius:12px; padding:10px 14px; font-size:1.15rem; font-weight:800; color:var(--blue-dark); margin-bottom:12px;">
            "${evalRes.spokenRaw}"
          </div>

          <div class="score-header-row">
            <div>
              <div style="font-weight:900; font-size:1.05rem; color:var(--text-main);">
                📊 口說練習估算分數
              </div>
              ${evalRes.isPartialAssessment ? `
                <div style="font-size:0.84rem; font-weight:800; color:#8a4b00; margin-top:2px;">
                  ⚠️ 部分項目無法評估（已依可評估的 85 分項目換算百分比）
                </div>
              ` : ""}
            </div>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <span class="score-big-badge">${evalRes.finalPercentScore} 分</span>
              <span class="score-grade-pill" style="background:${evalRes.gradeBg}; color:${evalRes.gradeColor};">
                ${evalRes.gradeLabel}
              </span>
            </div>
          </div>

          <div style="font-weight:800; font-size:0.95rem; color:var(--pink-dark); margin-bottom:8px;">
            ${starIcons}
          </div>

          <div class="score-breakdown-grid">
            <div class="breakdown-item">
              <div class="breakdown-label">1. 句子符合度（滿分 60）</div>
              <div class="breakdown-val">${evalRes.accuracyScore} / 60 分</div>
            </div>
            <div class="breakdown-item">
              <div class="breakdown-label">2. 句子完整度（滿分 25）</div>
              <div class="breakdown-val">${evalRes.completenessScore} / 25 分</div>
            </div>
            <div class="breakdown-item">
              <div class="breakdown-label">3. 流暢度估算（滿分 15）</div>
              <div class="breakdown-val" style="${!evalRes.fluencyAvailable ? 'color:var(--text-muted); font-size:0.92rem;' : ''}">
                ${evalRes.fluencyText}
              </div>
            </div>
          </div>

          <div style="margin-top:8px; font-size:0.96rem; font-weight:700; color:var(--text-main); line-height:1.55;">
            ${evalRes.feedbackTips.map(tip => `<div style="margin-top:4px;">${tip}</div>`).join("")}
          </div>

          <div class="disclaimer-note">
            此分數是根據瀏覽器語音辨識文字及有限的錄音資訊估算，並非專業發音評測，也不代表真正的 AI 發音評分。
          </div>

          <div style="text-align:center; margin-top:12px;">
            <button class="btn btn-outline" onclick="${retryOnClickStr}">
              🔄 清除結果並再次練習
            </button>
          </div>
        </div>
      `;
    }

    // --------------------------------------------------------------------------
    // 活動類型 G：關卡內「跟著唸一唸」互動口說練習室 (升級版 Web Speech API + 估算評分)
    // --------------------------------------------------------------------------
    function renderSpeakingPracticeActivity(step) {
      const idx = state.speakingLineIdx;
      const line = step.lines[idx];
      const lineKey = `${step.id}_${idx}`;
      const evalRes = state.speakingResultByLine[lineKey];
      const isSelfDone = !!state.speakingSelfPracticed[lineKey];

      const tabsHtml = step.lines.map((item, i) => {
        const k = `${step.id}_${i}`;
        const r = state.speakingResultByLine[k];
        const sp = state.speakingSelfPracticed[k];
        const badgeIcon = r ? (r.speakingStars > 0 ? "⭐" : "✅") : (sp ? "✅" : "🎤");
        return `
          <button class="chip-btn ${i === idx ? "active" : ""}" onclick="selectSpeakingLine(${i})">
            ${badgeIcon} 第 ${i + 1} 句
          </button>
        `;
      }).join("");

      return `
        <div class="speaking-studio">
          <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
            ${tabsHtml}
          </div>

          <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin:8px 0;">
            ${getFriendSVG(line.speaker, 76)}
            <div style="text-align:left;">
              <div style="font-weight:800; font-size:1.1rem; color:var(--text-main);">${line.speaker} 示範</div>
              <span class="voice-tag ${line.gender}">
                ${line.gender === "female" ? "👧 AI 女聲示範" : "👦 AI 男聲示範"}
              </span>
            </div>
          </div>

          <div class="speaking-target-card">
            <div class="speaking-en-text">${line.en}</div>
            <div class="speaking-zh-text">${line.zh}</div>
          </div>

          ${isSpeechRecognitionSupported ? `
            <!-- 支援 Web Speech API 的麥克風辨識與估算評分介面 -->
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px;">
              <button class="audio-btn" onclick="speakEnglish('${line.en.replace(/'/g, "\\'")}', '${line.gender}')">
                🔊 1. 聽示範發音
              </button>

              ${!state.speakingRecording ? `
                <button class="btn btn-pink" onclick="startSpeakingRecord('${step.id}', ${idx})">
                  🎙️ 2. 開始錄音
                </button>
              ` : `
                <button class="btn btn-red" onclick="stopCurrentRecordingByUser()">
                  ⏹️ 停止錄音
                </button>
              `}
            </div>

            ${state.speakingRecording ? `
              <div class="live-transcript-box">
                <div class="wave-bars">
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                  <div class="wave-bar"></div>
                </div>
                <div style="font-weight:800; color:var(--pink-dark); font-size:1.05rem;">
                  🎙️ 錄音中... 請對著麥克風大聲朗讀：<em>"${line.en}"</em>
                </div>
                <div style="margin-top:8px; background:#f8fbff; border-radius:10px; padding:8px 12px; font-weight:800; color:var(--blue-dark); min-height:40px;">
                  ${state.speakingInterimText
                    ? `👂 即時辨識中：${state.speakingInterimText}`
                    : "⏳ 等待語音輸入中..."}
                </div>
              </div>
            ` : ""}

            ${state.speakingErrorMsg && !state.speakingRecording ? `
              <div class="feedback-box error-alert">
                <div>${state.speakingErrorMsg}</div>
                <div style="margin-top:10px;">
                  <button class="btn btn-pink" onclick="startSpeakingRecord('${step.id}', ${idx})">
                    🎙️ 重新嘗試錄音
                  </button>
                </div>
              </div>
            ` : ""}

            ${evalRes && !state.speakingRecording ? renderEvaluationResultCard(evalRes, `startSpeakingRecord('${step.id}', ${idx})`) : ""}
          ` : `
            <!-- 不支援 SpeechRecognition 時的自行練習模式（絕不顯示辨識結果或假裝評分） -->
            <div class="feedback-box retry" style="text-align:left; margin-top:12px;">
              ℹ️ 目前使用的瀏覽器不支援語音辨識，請改用支援的瀏覽器，或使用下方的自行練習模式。
            </div>

            <div style="background:#ffffff; border:2px solid var(--border-soft); border-radius:16px; padding:14px; margin-top:12px;">
              <div style="font-weight:800; color:var(--blue-dark); margin-bottom:8px;">
                🎧 自行練習模式：請先聽示範發音，再大聲跟著朗讀一遍！
              </div>
              <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                <button class="audio-btn" onclick="speakEnglish('${line.en.replace(/'/g, "\\'")}', '${line.gender}')">
                  🔊 播放標準句子
                </button>
                <button class="btn btn-mint" onclick="markSelfPracticeDone('${step.id}', ${idx})">
                  ${isSelfDone ? "✅ 已完成自行朗讀（再練一次）" : "✅ 我已經大聲跟著唸過了"}
                </button>
              </div>
            </div>
          `}

          ${idx < step.lines.length - 1 ? `
            <div style="margin-top:14px;">
              <button class="nav-btn" onclick="selectSpeakingLine(${idx + 1})">
                切換到下一句練習 (${idx + 2}/${step.lines.length}) ➡
              </button>
            </div>
          ` : ""}
        </div>

        <!-- 口說練習為額外挑戰，無論是否使用麥克風皆可順利完成本任務 -->
        <div style="text-align:center; margin-top:18px;">
          <div style="font-size:0.92rem; font-weight:700; color:var(--text-muted); margin-bottom:8px;">
            💡 口說練習是額外挑戰，你可以隨時反覆練習，也可以直接點下方按鈕完成本任務領取徽章！
          </div>
          <button class="btn btn-mint" onclick="completeSpeakingStepAndFinishMission('${step.id}')">
            完成本任務！領取徽章 🏆
          </button>
        </div>
      `;
    }

    // 活動類型 F：標準視覺化選擇題 (MCQ)
    function renderMCQActivity(step) {
      let visualHtml = "";
      let promptGender = step.voiceGender || "auto";

      if (step.visualType === "friend") {
        visualHtml = getFriendSVG(step.visualValue, 110);
        promptGender = FRIEND_GENDER[step.visualValue] || "auto";
      } else if (step.visualType === "stationery") {
        visualHtml = getStationerySVG(step.visualValue, 130);
      } else if (step.visualType === "profile") {
        const friendName = step.profile.friend;
        const g = FRIEND_GENDER[friendName] || "auto";
        visualHtml = `
          <div class="profile-card">
            ${getFriendSVG(friendName, 92)}
            <div class="profile-details">
              ${step.profile.rows.map(r => `
                <div class="profile-row">
                  <span class="profile-label">${r.label}</span>
                  <span>${r.value}</span>
                </div>
              `).join("")}
              <div style="margin-top:4px;">
                <span class="voice-tag ${g}">${g === "female" ? "👧 Amy (女聲)" : `👦 ${friendName} (男聲)`}</span>
              </div>
            </div>
          </div>
        `;
      } else if (step.visualType === "full_profile") {
        const friendName = step.profile.friend;
        const g = FRIEND_GENDER[friendName] || "auto";
        visualHtml = `
          <div class="profile-card">
            ${getFriendSVG(friendName, 92)}
            <div class="profile-details">
              ${step.profile.rows.map(r => `
                <div class="profile-row">
                  <span class="profile-label">${r.label}</span>
                  <span>${r.value}</span>
                </div>
              `).join("")}
              <div style="margin-top:4px;">
                <span class="voice-tag ${g}">${g === "female" ? "👧 Amy (女聲)" : `👦 ${friendName} (男聲)`}</span>
              </div>
            </div>
            ${getStationerySVG(step.profile.item, 78)}
          </div>
        `;
      } else if (step.visualType === "near_far") {
        visualHtml = getNearFarSceneSVG(step.nearItem, step.farItem, step.target);
      } else if (step.visualType === "dialogue_bubble") {
        visualHtml = `
          <div style="display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;">
            ${getDetectiveSVG(state.avatar, 86)}
            <div style="background:#fff; border:3px solid var(--blue-main); border-radius:18px; padding:12px 18px; font-size:1.25rem; font-weight:800; color:var(--blue-dark);">
              ${step.speakerA} 🔭
            </div>
            ${getStationerySVG(step.item, 94)}
          </div>
        `;
      } else if (step.visualType === "mini_chat") {
        const blank1Text = step.chatStep === 1
          ? (state.questionAnswered ? "✅ My name is Ben." : "❓ [ 空格 1 ]")
          : "✅ My name is Ben.";
        const blank2Text = step.chatStep === 2
          ? (state.questionAnswered ? "✅ It's an eraser." : "❓ [ 空格 2 ]")
          : "......";

        visualHtml = `
          <div class="chat-list">
            <div class="chat-row">
              ${getDetectiveSVG(state.avatar, 54)}
              <div class="chat-bubble">
                A: Hello! What's your name?
                <button class="audio-btn" style="min-height:34px; padding:2px 10px; font-size:0.85rem; margin-left:6px;" onclick="speakEnglish('Hello! What is your name?', 'auto')">🔊</button>
              </div>
            </div>
            <div class="chat-row right">
              ${getFriendSVG("Ben", 54)}
              <div class="chat-bubble" style="${step.chatStep === 1 ? 'border-color:var(--pink-main); background:var(--pink-soft);' : ''}">
                B: ${blank1Text}
              </div>
            </div>
            <div class="chat-row">
              ${getDetectiveSVG(state.avatar, 54)}
              <div class="chat-bubble">
                A: How old are you?
                <button class="audio-btn" style="min-height:34px; padding:2px 10px; font-size:0.85rem; margin-left:6px;" onclick="speakEnglish('How old are you?', 'auto')">🔊</button>
              </div>
            </div>
            <div class="chat-row right">
              ${getFriendSVG("Ben", 54)}
              <div class="chat-bubble">
                B: I'm ten years old.
                <button class="audio-btn" style="min-height:34px; padding:2px 10px; font-size:0.85rem; margin-left:6px;" onclick="speakEnglish('I am ten years old.', 'male')">🔊</button>
              </div>
            </div>
            <div class="chat-row">
              ${getDetectiveSVG(state.avatar, 54)}
              <div class="chat-bubble" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <span>A: What's this?</span>
                ${getStationerySVG("eraser", 54)}
                <button class="audio-btn" style="min-height:34px; padding:2px 10px; font-size:0.85rem;" onclick="speakEnglish('What is this?', 'auto')">🔊</button>
              </div>
            </div>
            ${step.chatStep === 2 ? `
              <div class="chat-row right">
                ${getFriendSVG("Ben", 54)}
                <div class="chat-bubble" style="border-color:var(--pink-main); background:var(--pink-soft);">
                  B: ${blank2Text}
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }

      const cleanSpeech = step.promptEn.replace(/\(.*?\)/g, "").replace(/______/g, "blank").trim();

      const stepKey = `${state.currentMission}_${state.stepIndex}_${step.id}`;
      if (!state.shuffledOptions || state.shuffledOptionStepKey !== stepKey) {
        state.shuffledOptions = shuffleArray(
          step.options.map((text, origIdx) => ({ text, origIdx }))
        );
        state.shuffledOptionStepKey = stepKey;
      }

      const optionsHtml = state.shuffledOptions.map((optObj, displayIdx) => {
        let cls = "";
        if (state.questionAnswered && optObj.origIdx === step.correctIndex) {
          cls = "correct";
        } else if (state.selectedOptionIdx === displayIdx && optObj.origIdx !== step.correctIndex) {
          cls = "wrong";
        }
        return `
          <button class="option-btn ${cls}" ${state.questionAnswered ? "disabled" : ""} onclick="answerMCQ(${displayIdx})">
            <span>${optObj.text}</span>
          </button>
        `;
      }).join("");

      const isLastStep = state.stepIndex === MISSIONS[state.currentMission].steps.length - 1;
      const ansGender = step.visualType === "mini_chat" ? "male" : promptGender;

      return `
        <div class="question-box">
          ${visualHtml}
          <h3 class="english-prompt">${step.promptEn}</h3>
          ${step.visualType !== "mini_chat" ? `
            <button class="audio-btn" onclick="speakEnglish('${cleanSpeech.replace(/'/g, "\\'")}', '${promptGender}')">🔊 聽題目發音</button>
          ` : ""}
        </div>

        <div class="options-grid ${step.options.length === 3 ? 'three-col' : 'two-col'}">
          ${optionsHtml}
        </div>

        ${state.questionAnswered ? `
          <div class="feedback-box success">
            🌟 <strong>Great job! 答對了！</strong> 獲得 1 顆星星 ⭐<br/>
            <button class="audio-btn" style="margin-top:8px;" onclick="speakEnglish('${step.options[step.correctIndex].replace(/'/g, "\\'")}', '${ansGender}')">
              🔊 再聽一次正確句子：${step.options[step.correctIndex]}
            </button>
          </div>
          <div style="text-align:center; margin-top:16px;">
            <button class="btn btn-mint" onclick="nextStep()">
              ${isLastStep ? "完成本任務！領取徽章 🏆" : "繼續下一題 ➡"}
            </button>
          </div>
        ` : state.lastAnswerCorrect === false ? `
          <div class="feedback-box retry">
            💡 <strong>Good try! Let's try again!</strong><br/>
            ${step.hintZh}
          </div>
        ` : ""}
      `;
    }

    function getFinalIntroLines() {
      const selectedItemObj = STATIONERY_LIST.find(s => s.key === state.introItem) || STATIONERY_LIST[0];
      const safeName = state.introName.trim() || "Amy";
      return [
        { en: "Hello!", zh: "你好！" },
        { en: `My name is ${safeName}.`, zh: `我的名字是 ${safeName}。` },
        { en: `I'm ${state.introAge} years old.`, zh: `我今年 ${state.introAge === "eight" ? "8" : state.introAge === "nine" ? "9" : "10"} 歲。` },
        { en: "What's this?", zh: "這是什麼？" },
        { en: `It's ${selectedItemObj.phrase}.`, zh: `這是${selectedItemObj.zh.split("（")[0]}。` }
      ];
    }

                  <button class="btn btn-pink" onclick="startIntroMicPractice()">

              </div>

                <button class="audio-btn" onclick="speakEnglish('${activeTargetEn.replace(/'/g, "\\'")}', '${stageGender}')">

    function handleStudentCodeInput(inputEl) {
      const cleaned = (inputEl.value || "").replace(/\D/g, "").slice(0, 5);
      if (inputEl.value !== cleaned) {
        inputEl.value = cleaned;
      }
      state.studentCodeInput = cleaned;
      state.studentLoginError = "";

      const previewEl = document.getElementById("studentCodePreviewEl");
      if (previewEl) {
        if (/^\d{5}$/.test(cleaned)) {
          const matchedRoster = state.rosterList.find(r => r.code === cleaned);
          previewEl.innerHTML = `
            <div style="margin-top:8px; font-weight:800; color:var(--mint-dark); font-size:0.98rem;">
              ✅ ${formatFiveDigitClassSeat(cleaned)} ${matchedRoster && matchedRoster.name ? `（${matchedRoster.name}）` : ""}
            </div>
          `;
        } else {
          previewEl.innerHTML = "";
        }
      }

      const errorEl = document.getElementById("studentLoginErrorEl");
      if (errorEl) {
        errorEl.innerHTML = "";
      }
    }

    function selectAvatar(id) {
      playTone("click");
      state.avatar = id;
      const d = DETECTIVES.find(item => item.id === id);
      if (d) speakEnglish(`Hello! I am ${d.en}.`, d.gender);
      render();
    }

    async function startAdventure() {
      const code = (state.studentCodeInput || "").trim();
      if (!/^\d{5}$/.test(code)) {
        playTone("wrong");
        state.studentLoginError = "⚠️ 請先輸入完整的 5 碼班級座號（例如 3 年 1 班 5 號請輸入 30105）！";
        render();
        return;
      }

      const rosterEntry = state.rosterList.find(r => r.code === code);
      if (state.strictRosterOnly && !rosterEntry) {
        playTone("wrong");
        state.studentLoginError = `🚫 找不到學號「${code}」，請確認是否輸入錯誤，或請老師在後台新增名單！`;
        render();
        return;
      }

      playTone("correct");
      state.studentLoginError = "";
      state.currentStudent = {
        code,
        name: rosterEntry ? rosterEntry.name : ""
      };

      // 嘗試從雲端或本機載入該學生既有學習紀錄
      let prevData = state.progressMap[code] || null;
      if (!prevData && window.CloudSync) {
        prevData = await window.CloudSync.fetchStudentProgressOnce(code);
      }

      if (prevData) {
        state.stars = prevData.stars || 0;
        state.awardedKeys = prevData.awardedKeys || {};
        state.speakingStarsTotal = prevData.speakingStarsTotal || 0;
        state.speakingBestStarsByLine = prevData.speakingBestStarsByLine || {};
        state.completedMissions = prevData.completedMissions || { 1: false, 2: false, 3: false, 4: false };
        state.missionStars = prevData.missionStars || { 1: 0, 2: 0, 3: 0, 4: 0 };
        state.introFinished = !!prevData.introFinished;
      } else {
        state.stars = 0;
        state.awardedKeys = {};
        state.speakingStarsTotal = 0;
        state.speakingBestStarsByLine = {};
        state.completedMissions = { 1: false, 2: false, 3: false, 4: false };
        state.missionStars = { 1: 0, 2: 0, 3: 0, 4: 0 };
        state.introFinished = false;
      }

      syncCurrentStudentProgressToCloud();
      state.screen = "hub";
      render();
    }

    function goToHub() {
      stopActiveRecognition(true);
      state.speakingRecording = false;
      state.introRecording = false;
      playTone("click");
      state.screen = "hub";
      render();
    }

    function openFinalStage() {
      stopActiveRecognition(true);
      playTone("click");
      state.screen = "final";
      state.introStep = 0;
      state.introRecording = false;
      state.introInterimText = "";
      state.introErrorMsg = "";
      state.introEvalResult = null;
      state.introFinished = false;
      render();
    }

    function startMission(missionId) {
      stopActiveRecognition(true);
      playTone("click");
      state.currentMission = missionId;
      state.stepIndex = 0;
      state.screen = "mission";
      resetStepTempState();
      render();
    }

    function resetStepTempState() {
      state.questionAnswered = false;
      state.lastAnswerCorrect = null;
      state.selectedOptionIdx = null;
      state.shuffledOptions = null;
      state.shuffledOptionStepKey = null;
      state.shuffledRightPairs = null;
      state.shuffledRightPairsKey = null;
      state.shuffledDialogueLines = null;
      state.shuffledDialogueKey = null;
      state.matchState = { selectedLeft: null, matchedIds: [], errorPair: null };
      state.boxOpened = false;
      state.boxItemIndex = 0;
      state.orderSlots = [null, null, null, null];
      state.orderChecked = false;
      state.speakingLineIdx = 0;
      state.speakingRecording = false;
      state.speakingInterimText = "";
      state.speakingErrorMsg = "";
    }

    // 原本 26 顆遊戲星星加分函式（完全維持原有計分規則）
    function awardStarOnce(key, missionId) {
      if (!state.awardedKeys[key]) {
        state.awardedKeys[key] = true;
        state.stars += 1;
        if (missionId) {
          state.missionStars[missionId] = (state.missionStars[missionId] || 0) + 1;
        }
        syncCurrentStudentProgressToCloud();
      }
    }

    // 口說練習星星更新（取單句最高星等累加，與原本 26 顆星星分開計算）
    function recordSpeakingStars(uniqueLineKey, earnedStars) {
      const prevBest = state.speakingBestStarsByLine[uniqueLineKey] || 0;
      if (earnedStars > prevBest) {
        state.speakingBestStarsByLine[uniqueLineKey] = earnedStars;
        state.speakingStarsTotal += (earnedStars - prevBest);
        syncCurrentStudentProgressToCloud();
      }
    }

    // 口說練習星星更新（取單句最高星等累加，與原本 26 顆星星分開計算）
    function recordSpeakingStars(uniqueLineKey, earnedStars) {
      const prevBest = state.speakingBestStarsByLine[uniqueLineKey] || 0;
      if (earnedStars > prevBest) {
        state.speakingBestStarsByLine[uniqueLineKey] = earnedStars;
        state.speakingStarsTotal += (earnedStars - prevBest);
      }
    }

    function visitCharacterCard(name, line, gender = "auto") {
      playTone("click");
      speakEnglish(line, gender);
      state.visitedCards[name] = true;
      render();
    }

    function visitAgeCard(name, line, gender = "auto") {
      playTone("click");
      speakEnglish(line, gender);
      state.visitedCards["age_" + name] = true;
      render();
    }

    function openNextBoxItem() {
      playTone("correct");
      if (!state.boxOpened) {
        state.boxOpened = true;
      } else {
        state.boxItemIndex = (state.boxItemIndex + 1) % STATIONERY_LIST.length;
      }
      const item = STATIONERY_LIST[state.boxItemIndex];
      state.visitedCards["box_" + item.key] = true;
      speakEnglish(item.sentence, "auto");
      render();
    }

    function selectMatchLeft(id, text, gender = "auto") {
      playTone("click");
      speakEnglish(text, gender);
      state.matchState.selectedLeft = id;
      state.matchState.errorPair = null;
      render();
    }

    function selectMatchRight(id, text, gender = "auto") {
      speakEnglish(text, gender);
      if (!state.matchState.selectedLeft) {
        playTone("click");
        return;
      }
      if (state.matchState.selectedLeft === id) {
        playTone("correct");
        state.matchState.matchedIds.push(id);
        state.matchState.selectedLeft = null;
        state.matchState.errorPair = null;
        const step = MISSIONS[state.currentMission].steps[state.stepIndex];
        if (state.matchState.matchedIds.length === step.pairs.length) {
          awardStarOnce(step.id, state.currentMission);
        }
      } else {
        playTone("wrong");
        state.matchState.errorPair = true;
        state.matchState.selectedLeft = null;
      }
      render();
    }

    function pickOrderLine(line) {
      playTone("click");
      speakEnglish(line, "auto");
      const emptyIdx = state.orderSlots.findIndex(s => s === null);
      if (emptyIdx !== -1) {
        state.orderSlots[emptyIdx] = line;
        state.orderChecked = false;
      }
      render();
    }

    function removeOrderSlot(idx) {
      if (state.questionAnswered) return;
      if (state.orderSlots[idx] !== null) {
        playTone("click");
        state.orderSlots[idx] = null;
        state.orderChecked = false;
        render();
      }
    }

    function clearOrderSlots() {
      playTone("click");
      state.orderSlots = [null, null, null, null];
      state.orderChecked = false;
      render();
    }

    function checkOrderDialogue() {
      const step = MISSIONS[state.currentMission].steps[state.stepIndex];
      state.orderChecked = true;
      const isMatch = step.correctLines.every((val, i) => state.orderSlots[i] === val);
      if (isMatch) {
        playTone("correct");
        state.questionAnswered = true;
        awardStarOnce(step.id, state.currentMission);
      } else {
        playTone("wrong");
      }
      render();
    }

    // --------------------------------------------------------------------------
    // 關卡內口說練習控制 (Speaking Practice Handlers)
    // --------------------------------------------------------------------------
    function selectSpeakingLine(idx) {
      stopActiveRecognition(true);
      playTone("click");
      state.speakingLineIdx = idx;
      state.speakingRecording = false;
      state.speakingInterimText = "";
      state.speakingErrorMsg = "";
      render();
    }

    function startSpeakingRecord(stepId, lineIdx) {
      const step = MISSIONS[state.currentMission].steps[state.stepIndex];
      const targetLine = step.lines[lineIdx];
      const lineKey = `${stepId}_${lineIdx}`;

      // 每次重新錄音：清除前一次辨識結果、前一次評分、前一次錯誤提示、重設錄音狀態
      stopActiveRecognition(true);
      playTone("click");
      state.speakingRecording = true;
      state.speakingInterimText = "";
      state.speakingErrorMsg = "";
      delete state.speakingResultByLine[lineKey];
      render();

      beginSpeechSession({
        targetEn: targetLine.en,
        onStateChange: (isRec) => {
          state.speakingRecording = isRec;
          render();
        },
        onInterim: (text) => {
          state.speakingInterimText = text;
          render();
        },
        onError: (msg) => {
          state.speakingRecording = false;
          state.speakingErrorMsg = msg;
          playTone("wrong");
          render();
        },
        onFinalEvaluated: (evalResult) => {
          state.speakingRecording = false;
          state.speakingErrorMsg = "";
          state.speakingResultByLine[lineKey] = evalResult;
          recordSpeakingStars(lineKey, evalResult.speakingStars);
          if (evalResult.finalPercentScore >= 70) {
            playTone("correct");
          } else {
            playTone("click");
          }
          render();
        }
      });
    }

    function markSelfPracticeDone(stepId, lineIdx) {
      playTone("correct");
      state.speakingSelfPracticed[`${stepId}_${lineIdx}`] = true;
      render();
    }

    function completeSpeakingStepAndFinishMission(stepId) {
      stopActiveRecognition(true);
      state.speakingRecording = false;
      // 保留原有每關 1 顆任務星機制（滿分 26 顆維持不變），即使未用麥克風也可順利過關
      awardStarOnce(stepId, state.currentMission);
      nextStep();
    }

    function answerMCQ(displayIdx) {
      const step = MISSIONS[state.currentMission].steps[state.stepIndex];
      const chosenObj = state.shuffledOptions ? state.shuffledOptions[displayIdx] : null;
      const origIdx = chosenObj ? chosenObj.origIdx : displayIdx;
      state.selectedOptionIdx = displayIdx;
      let ansGender = step.voiceGender || "auto";
      if (step.visualType === "mini_chat") ansGender = "male";
      if (origIdx === step.correctIndex) {
        playTone("correct");
        state.questionAnswered = true;
        state.lastAnswerCorrect = true;
        awardStarOnce(step.id, state.currentMission);
        speakEnglish(step.options[step.correctIndex], ansGender);
      } else {
        playTone("wrong");
        state.lastAnswerCorrect = false;
      }
      render();
    }

    function nextStep() {
      stopActiveRecognition(true);
      playTone("click");
      const m = MISSIONS[state.currentMission];
      if (state.stepIndex < m.steps.length - 1) {
        state.stepIndex += 1;
        resetStepTempState();
        render();
      } else {
        playTone("fanfare");
        state.completedMissions[state.currentMission] = true;
        syncCurrentStudentProgressToCloud();
        state.screen = "missionComplete";
        render();
      }
    }

    // --------------------------------------------------------------------------
    // 最終自我介紹舞台控制 (Final Stage Handlers)
    // --------------------------------------------------------------------------
    function setIntroName(val) {
      state.introName = val;
      state.introEvalResult = null;
      state.introErrorMsg = "";
      if (state.screen === "final") {
        const speechLines = document.querySelectorAll(".speech-line");
        if (speechLines.length > 0) {
          render();
        }
      }
    }

    function setIntroAge(age) {
      playTone("click");
      state.introAge = age;
      state.introEvalResult = null;
      state.introErrorMsg = "";
      render();
    }

    function setIntroItem(item) {
      playTone("click");
      state.introItem = item;
      state.introEvalResult = null;
      state.introErrorMsg = "";
      const obj = STATIONERY_LIST.find(s => s.key === item);
      if (obj) speakEnglish(obj.phrase, "auto");
      render();
    }

    function startIntroMicPractice() {
      const lines = getFinalIntroLines();
      const showAll = state.introStep >= lines.length;
      const targetEn = showAll
        ? lines.map(l => l.en).join(" ")
        : lines[Math.min(state.introStep, lines.length - 1)].en;

      // 每次重新錄音：完整清除前一次辨識結果、評分與錯誤提示
      stopActiveRecognition(true);
      playTone("click");
      state.introRecording = true;
      state.introInterimText = "";
      state.introErrorMsg = "";
      state.introEvalResult = null;
      render();

      beginSpeechSession({
        targetEn,
        onStateChange: (isRec) => {
          state.introRecording = isRec;
          render();
        },
        onInterim: (text) => {
          state.introInterimText = text;
          render();
        },
        onError: (msg) => {
          state.introRecording = false;
          state.introErrorMsg = msg;
          playTone("wrong");
          render();
        },
        onFinalEvaluated: (evalResult) => {
          state.introRecording = false;
          state.introErrorMsg = "";
          state.introEvalResult = evalResult;
          recordSpeakingStars(`final_intro_${state.introStep}`, evalResult.speakingStars);
          if (evalResult.finalPercentScore >= 70) {
            playTone("correct");
          } else {
            playTone("click");
          }
          render();
        }
      });
    }

    function nextIntroLine() {
      stopActiveRecognition(true);
      playTone("correct");
      state.introRecording = false;
      state.introInterimText = "";
      state.introErrorMsg = "";
      state.introEvalResult = null;
      state.introStep += 1;
      render();
    }

    function restartIntroPractice() {
      stopActiveRecognition(true);
      playTone("click");
      state.introRecording = false;
      state.introInterimText = "";
      state.introErrorMsg = "";
      state.introEvalResult = null;
      state.introStep = 0;
      state.introFinished = false;
      render();
    }

    function finishAllChallenge() {
      stopActiveRecognition(true);
      playTone("fanfare");
      state.introFinished = true;
      syncCurrentStudentProgressToCloud();
      speakEnglish("You're an English Star!", "auto");
      render();
    }

    function fullResetGame() {
      stopActiveRecognition(true);
      playTone("click");
      state.screen = "start";
      state.stars = 0;
      state.awardedKeys = {};
      state.speakingStarsTotal = 0;
      state.speakingBestStarsByLine = {};
      state.completedMissions = { 1: false, 2: false, 3: false, 4: false };
      state.missionStars = { 1: 0, 2: 0, 3: 0, 4: 0 };
      state.visitedCards = {};
      state.speakingResultByLine = {};
      state.speakingSelfPracticed = {};
      state.introStep = 0;
      state.introRecording = false;
      state.introInterimText = "";
      state.introErrorMsg = "";
      state.introEvalResult = null;
      state.introFinished = false;
      resetStepTempState();
      render();
    }

    window.onload = function () {
      loadSystemVoices();
      initAccessControlFromURL();
      render();
    };
  </script>
</body>
</html>
