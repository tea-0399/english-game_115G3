<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stationery Detective 2.0｜My Little School Life</title>
  <style>
    /* ==========================================================================
       1. 整體色彩系統與基礎排版 (適合國小三年級與 iPad 觸控操作)
       ========================================================================== */
    :root {
      --bg-sky: #eef7ff;
      --bg-card: #ffffff;
      --blue-main: #4a90e2;
      --blue-dark: #2c6bb8;
      --blue-soft: #d9ecff;
      --yellow-main: #ffd15c;
      --yellow-dark: #d99b16;
      --yellow-soft: #fff6d9;
      --pink-main: #ff7aa2;
      --pink-dark: #d84b76;
      --pink-soft: #ffe6ee;
      --mint-main: #4cc9a0;
      --mint-dark: #259470;
      --mint-soft: #dcf7ee;
      --purple-main: #8b7ae8;
      --purple-soft: #f1eeff;
      --text-main: #283548;
      --text-muted: #5f6f85;
      --border-soft: #dbe7f5;
      --shadow-card: 0 10px 26px rgba(44, 107, 184, 0.12);
      --radius-xl: 26px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input {
      user-select: text;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, #e6f4ff 0%, #fff9e8 52%, #e8fbf3 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部固定導覽列 */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--border-soft);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--blue-dark);
    }

    .brand-badge {
      background: var(--yellow-soft);
      border: 2px solid var(--yellow-main);
      color: #7c5300;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--yellow-soft);
      border: 2px solid var(--yellow-main);
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 800;
      font-size: 0.95rem;
      color: #6b4700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-pill.speaking-pill {
      background: var(--pink-soft);
      border-color: var(--pink-main);
      color: var(--pink-dark);
    }

    .nav-btn {
      background: var(--blue-soft);
      color: var(--blue-dark);
      border: 2px solid var(--blue-main);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .nav-btn:active {
      transform: scale(0.96);
    }

    /* 主容器 */
    .app-container {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .card {
      background: var(--bg-card);
      border: 3px solid var(--border-soft);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      padding: 22px 20px;
      margin-bottom: 18px;
    }

    /* 標題與故事卡 */
    .hero-banner {
      text-align: center;
      background: linear-gradient(135deg, #ffffff 0%, #f0f8ff 100%);
      border-color: #b9dafc;
    }

    .game-title {
      font-size: clamp(1.65rem, 4vw, 2.35rem);
      font-weight: 900;
      color: var(--blue-dark);
      margin: 6px 0 4px;
      letter-spacing: 0.3px;
    }

    .game-subtitle {
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      font-weight: 800;
      color: var(--pink-dark);
      margin-bottom: 12px;
    }

    .story-box {
      background: var(--yellow-soft);
      border: 2px dashed var(--yellow-dark);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      font-size: 1.05rem;
      line-height: 1.65;
      color: #4f3a08;
      max-width: 720px;
      margin: 0 auto 18px;
      font-weight: 600;
    }

    /* 偵探角色選擇卡片 */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 14px;
      margin: 16px 0 22px;
    }

    .avatar-card {
      background: #f9fcff;
      border: 3px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .avatar-card.selected {
      background: var(--mint-soft);
      border-color: var(--mint-main);
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(76, 201, 160, 0.25);
    }

    .avatar-name-zh {
      font-weight: 800;
      font-size: 1.08rem;
      margin-top: 8px;
      color: var(--text-main);
    }

    .avatar-name-en {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--blue-dark);
    }

    /* 聲線小標籤 */
    .voice-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .voice-tag.female {
      background: var(--pink-soft);
      color: var(--pink-dark);
    }

    .voice-tag.male {
      background: var(--blue-soft);
      color: var(--blue-dark);
    }

    /* 通用大按鈕 (iPad 觸控友善 >= 52px) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 54px;
      padding: 12px 24px;
      border-radius: 999px;
      border: none;
      font-size: 1.08rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.15s ease;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(180deg, #5da4f5 0%, #3b82d6 100%);
      color: #ffffff;
      box-shadow: 0 5px 0 #265fa3;
    }

    .btn-mint {
      background: linear-gradient(180deg, #57d6ac 0%, #32b388 100%);
      color: #ffffff;
      box-shadow: 0 5px 0 #218563;
    }

    .btn-pink {
      background: linear-gradient(180deg, #ff8eb0 0%, #eb5e88 100%);
      color: #ffffff;
      box-shadow: 0 5px 0 #b83b60;
    }

    .btn-red {
      background: linear-gradient(180deg, #ff6b6b 0%, #e03e3e 100%);
      color: #ffffff;
      box-shadow: 0 5px 0 #a82424;
    }

    .btn-yellow {
      background: linear-gradient(180deg, #ffdc73 0%, #f5be2e 100%);
      color: #4f3500;
      box-shadow: 0 5px 0 #c28e0e;
    }

    .btn-outline {
      background: #ffffff;
      color: var(--blue-dark);
      border: 3px solid var(--blue-main);
    }

    /* 任務大廳網格 */
    .hub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #f3f9ff 0%, #fff9e6 100%);
    }

    .hub-detective-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .missions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 14px;
    }

    .mission-card {
      background: #ffffff;
      border: 3px solid var(--border-soft);
      border-radius: var(--radius-xl);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.15s ease;
    }

    .mission-card.completed {
      border-color: var(--mint-main);
      background: linear-gradient(180deg, #ffffff 0%, #f2fcf8 100%);
    }

    .mission-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      width: fit-content;
    }

    /* 徽章展示列 */
    .badges-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .badge-slot {
      background: #f8fafd;
      border: 2px dashed #c4d5ea;
      border-radius: var(--radius-lg);
      padding: 12px 10px;
      text-align: center;
      opacity: 0.58;
      transition: all 0.2s ease;
    }

    .badge-slot.earned {
      opacity: 1;
      background: var(--yellow-soft);
      border: 2px solid var(--yellow-main);
      box-shadow: 0 6px 14px rgba(217, 155, 22, 0.15);
    }

    /* 關卡內進度條與題目區 */
    .progress-wrap {
      margin-bottom: 16px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--blue-dark);
      margin-bottom: 6px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #e6effa;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue-main), var(--mint-main));
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .activity-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--pink-soft);
      color: var(--pink-dark);
      padding: 5px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .instruction-zh {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 4px 0 14px;
      line-height: 1.5;
    }

    .question-box {
      background: #f6faff;
      border: 2px solid #d4e6fb;
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .english-prompt {
      font-size: clamp(1.35rem, 3.2vw, 1.85rem);
      font-weight: 800;
      color: var(--blue-dark);
      margin: 0;
    }

    .audio-btn {
      background: #ffffff;
      border: 2px solid var(--blue-main);
      color: var(--blue-dark);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 48px;
    }

    .audio-btn:active {
      transform: scale(0.95);
      background: var(--blue-soft);
    }

    /* 選擇題選項格 */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      width: 100%;
    }

    .options-grid.three-col {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    .option-btn {
      background: #ffffff;
      border: 3px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 16px 14px;
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--text-main);
      cursor: pointer;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.14s ease;
      text-align: center;
    }

    .option-btn:active {
      transform: scale(0.97);
    }

    .option-btn.correct {
      background: var(--mint-soft);
      border-color: var(--mint-main);
      color: #165c45;
    }

    .option-btn.wrong {
      background: var(--pink-soft);
      border-color: var(--pink-main);
      color: #8f1d40;
    }

    /* 回饋訊息框 */
    .feedback-box {
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      margin-top: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.55;
      animation: popIn 0.22s ease;
    }

    .feedback-box.success {
      background: var(--mint-soft);
      border: 2px solid var(--mint-main);
      color: #135740;
    }

    .feedback-box.retry {
      background: var(--yellow-soft);
      border: 2px solid var(--yellow-main);
      color: #5e3f00;
    }

    .feedback-box.error-alert {
      background: var(--pink-soft);
      border: 2px solid var(--pink-main);
      color: #8f1d40;
    }

    /* 人物資訊卡樣式 */
    .profile-card {
      background: #ffffff;
      border: 3px solid var(--yellow-main);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(217, 155, 22, 0.12);
    }

    .profile-details {
      text-align: left;
      font-size: 1.12rem;
      line-height: 1.7;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: var(--text-main);
    }

    .profile-label {
      background: var(--blue-soft);
      color: var(--blue-dark);
      padding: 2px 10px;
      border-radius: 8px;
      font-size: 0.92rem;
    }

    /* 探索卡片 (活動一：認識角色與年齡) */
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }

    .explore-card {
      background: #ffffff;
      border: 3px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .explore-card.visited {
      border-color: var(--mint-main);
      background: #f5fdfa;
    }

    /* 問答配對樣式 */
    .match-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
    }

    @media (max-width: 600px) {
      .match-columns {
        grid-template-columns: 1fr;
      }
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-tile {
      background: #ffffff;
      border: 3px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .match-tile.selected {
      background: var(--yellow-soft);
      border-color: var(--yellow-dark);
    }

    .match-tile.matched {
      background: var(--mint-soft);
      border-color: var(--mint-main);
      color: #165c45;
      cursor: default;
    }

    /* 神祕文具箱動畫 */
    .mystery-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 10px;
    }

    .box-container {
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .box-container:active {
      transform: scale(0.95);
    }

    .item-reveal {
      animation: popIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      background: #ffffff;
      border: 3px solid var(--mint-main);
      border-radius: var(--radius-xl);
      padding: 16px 28px;
      text-align: center;
    }

    /* 對話排序互動 (iPad 點擊排序) */
    .order-slots {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 560px;
      margin: 0 auto 16px;
    }

    .order-slot {
      min-height: 56px;
      border: 2px dashed #9ec3eb;
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.06rem;
      font-weight: 800;
      cursor: pointer;
    }

    .order-slot.filled {
      border-style: solid;
      border-color: var(--blue-main);
      background: var(--blue-soft);
      color: var(--blue-dark);
    }

    .slot-num {
      background: var(--blue-main);
      color: #ffffff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .bank-chip {
      background: #ffffff;
      border: 3px solid var(--yellow-main);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      min-height: 52px;
    }

    .bank-chip:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* 對話泡泡框 */
    .chat-list {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .chat-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .chat-row.right {
      flex-direction: row-reverse;
    }

    .chat-bubble {
      background: #ffffff;
      border: 2px solid var(--blue-main);
      border-radius: 18px;
      padding: 10px 14px;
      font-size: 1.05rem;
      font-weight: 800;
      max-width: 82%;
    }

    .chat-row.right .chat-bubble {
      background: var(--mint-soft);
      border-color: var(--mint-main);
    }

    /* 口說練習室元件 (Speaking Practice Studio) */
    .speaking-studio {
      background: linear-gradient(135deg, #f3f9ff 0%, #fff8eb 100%);
      border: 3px solid var(--blue-main);
      border-radius: var(--radius-xl);
      padding: 20px 18px;
      width: 100%;
      max-width: 660px;
      margin: 0 auto;
      text-align: center;
    }

    .speaking-target-card {
      background: #ffffff;
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin: 12px 0;
    }

    .speaking-en-text {
      font-size: clamp(1.35rem, 3.2vw, 1.85rem);
      font-weight: 800;
      color: var(--blue-dark);
      margin-bottom: 6px;
    }

    .speaking-zh-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .live-transcript-box {
      margin-top: 14px;
      background: #ffffff;
      border: 2px dashed var(--pink-main);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .transcript-result-card {
      margin-top: 14px;
      background: #ffffff;
      border: 3px solid var(--blue-main);
      border-radius: 18px;
      padding: 16px;
      text-align: left;
      animation: popIn 0.25s ease;
    }

    .score-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-soft);
      margin-bottom: 10px;
    }

    .score-big-badge {
      background: var(--yellow-soft);
      border: 2px solid var(--yellow-main);
      color: #6b4700;
      border-radius: 14px;
      padding: 6px 14px;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .score-grade-pill {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 1.05rem;
    }

    .score-breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 8px;
      margin: 10px 0;
    }

    .breakdown-item {
      background: #f8fbff;
      border: 2px solid var(--border-soft);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }

    .breakdown-label {
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.82rem;
    }

    .breakdown-val {
      color: var(--blue-dark);
      font-weight: 900;
      font-size: 1.02rem;
      margin-top: 2px;
    }

    .disclaimer-note {
      margin-top: 10px;
      padding: 8px 12px;
      background: #f4f6f9;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;

  </style>
</head>
<body>

  <!-- 動態遊戲主畫面容器 -->

  <!-- Firebase 雲端資料庫連線（支援班級名單與學生學習紀錄跨裝置同步） -->
  <script type="module">
    import { initializeApp, getApps, deleteApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const CUSTOM_FB_STORAGE_KEY = "stationery_detective_custom_fb_config_v1";
    const DEFAULT_BUILTIN_FB_CONFIG = {
      apiKey: "AIzaSyAWlpwBUE8FixscZxTGcVAC0t6998uj1Ik",
      authDomain: "english-practice115.firebaseapp.com",
      projectId: "english-practice115",
      storageBucket: "english-practice115.firebasestorage.app",
      messagingSenderId: "148682840529",
      appId: "1:148682840529:web:93ddc39b9f185d87a968f0"
    };

    window.CloudSync = {
      ready: false,
      statusText: "🟡 僅限單機儲存（尚未綁定雲端資料庫，手機與電腦資料不會互通）",
      db: null,
      auth: null,
      user: null,
      appId: typeof __app_id !== "undefined" ? __app_id : "stationery-detective-git-v1",
      getSavedCustomConfig: function () {
        try {
          const raw = localStorage.getItem(CUSTOM_FB_STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      },
      saveCustomConfigAndConnect: async function (rawInputText) {
        try {
          // 允許老師直接貼上整段 const firebaseConfig = { ... }; 或純 JSON
          let cleaned = (rawInputText || "").trim();
          const objMatch = cleaned.match(/\{[\s\S]*\}/);
          if (!objMatch) {
            return { ok: false, msg: "⚠️ 找不到有效的 { ... } 設定內容，請完整複製 Firebase 設定碼！" };
          }
          // 將 JS 物件鍵值轉為合法 JSON（例如 apiKey: "..." -> "apiKey": "..."）
          let jsonStr = objMatch[0]
            .replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":')
            .replace(/'/g, '"')
            .replace(/,\s*}/g, '}');

          const parsed = JSON.parse(jsonStr);
          if (!parsed.apiKey || !parsed.projectId) {
            return { ok: false, msg: "⚠️ 設定檔缺少 apiKey 或 projectId，請確認是否複製完整！" };
          }
          localStorage.setItem(CUSTOM_FB_STORAGE_KEY, JSON.stringify(parsed));
          await this.init(parsed);
          return { ok: true, msg: "✅ 雲端資料庫設定已儲存並嘗試連線！" };
        } catch (e) {
          return { ok: false, msg: "❌ 格式解析失敗，請確認貼上的 Firebase 設定碼是否正確。" };
        }
      },
      clearCustomConfig: function () {
        try {
          localStorage.removeItem(CUSTOM_FB_STORAGE_KEY);
        } catch (e) {}
        this.ready = false;
        this.statusText = "🟡 僅限單機儲存（已清除自訂雲端設定）";
      },
      init: async function (overrideConfig = null) {
        try {
          let firebaseConfig = overrideConfig;
          if (!firebaseConfig && typeof __firebase_config !== "undefined" && __firebase_config) {
            firebaseConfig = JSON.parse(__firebase_config);
          }
          if (!firebaseConfig) {
            firebaseConfig = this.getSavedCustomConfig();
          }
          if (!firebaseConfig && typeof DEFAULT_BUILTIN_FB_CONFIG !== "undefined") {
            firebaseConfig = DEFAULT_BUILTIN_FB_CONFIG;
          }
          if (!firebaseConfig) {
            this.ready = false;
            this.statusText = "🟡 僅限單機儲存（上傳至 GitHub 後，請至「3. 雲端同步與密碼設定」貼上 Firebase 設定即可跨手機同步）";
            if (window.state && window.state.showTeacherModal && typeof window.renderTeacherModal === "function") window.renderTeacherModal();
            return;
          }

          // 若已有舊的 Firebase App 實例先清除再重建
          const existingApps = getApps();
          for (const oldApp of existingApps) {
            await deleteApp(oldApp);
          }

          const app = initializeApp(firebaseConfig);
          this.auth = getAuth(app);
          this.db = getFirestore(app);
          this.statusText = "⏳ 正在連線至雲端資料庫...";
          if (window.state && window.state.showTeacherModal && typeof window.renderTeacherModal === "function") window.renderTeacherModal();

          if (typeof __initial_auth_token !== "undefined" && __initial_auth_token && !overrideConfig) {
            await signInWithCustomToken(this.auth, __initial_auth_token);
          } else {
            await signInAnonymously(this.auth);
          }

          onAuthStateChanged(this.auth, (user) => {
            this.user = user;
            if (user) {
              this.ready = true;
              this.statusText = `🟢 雲端資料庫已連線（專案：${firebaseConfig.projectId || "已啟用"}，手機與電腦即時同步中！）`;
              this.subscribeAll();
              if (window.state && window.state.showTeacherModal && typeof window.renderTeacherModal === "function") window.renderTeacherModal();
            }
          });
        } catch (e) {
          console.warn("CloudSync fallback to localStorage:", e);
          this.ready = false;
          this.statusText = `🔴 雲端連線失敗（請確認 Firebase 已開啟「匿名登入」與「Firestore 資料庫」）：${e.message}`;
          if (window.state && window.state.showTeacherModal && typeof window.renderTeacherModal === "function") window.renderTeacherModal();
        }
      },
      subscribeAll: function () {
        if (!this.ready || !this.user || !this.db) return;

        // 監聽教師設定（密碼與是否限制名單）
        const settingsRef = doc(this.db, "artifacts", this.appId, "public", "data", "settings", "teacherConfig");
        onSnapshot(settingsRef, (snap) => {
          if (snap.exists() && window.state) {
            const data = snap.data();
            if (data.pin) window.state.teacherPin = String(data.pin);
            if (typeof data.strictRoster === "boolean") window.state.strictRosterOnly = data.strictRoster;
            if (typeof window.saveTeacherLocalBackup === "function") window.saveTeacherLocalBackup();
            if (window.state.showTeacherModal && typeof window.renderTeacherModal === "function") window.renderTeacherModal();
          }
        }, (err) => console.warn(err));

        // 監聽班級學生名單
        const rosterCol = collection(this.db, "artifacts", this.appId, "public", "data", "roster");
        onSnapshot(rosterCol, (snap) => {
          if (!window.state) return;
          const list = [];
          snap.forEach((d) => list.push(d.data()));
          list.sort((a, b) => String(a.code).localeCompare(String(b.code)));
          window.state.rosterList = list;
          if (typeof window.saveTeacherLocalBackup === "function") window.saveTeacherLocalBackup();
          if (window.state.showTeacherModal && typeof window.renderTeacherModal === "function") window.renderTeacherModal();
        }, (err) => console.warn(err));

        // 監聽學生學習進度紀錄
        const progressCol = collection(this.db, "artifacts", this.appId, "public", "data", "studentProgress");
        onSnapshot(progressCol, (snap) => {
          if (!window.state) return;
          const map = {};
          snap.forEach((d) => {
            map[d.id] = d.data();
          });
          window.state.progressMap = map;
          if (typeof window.saveTeacherLocalBackup === "function") window.saveTeacherLocalBackup();
          if (window.state.showTeacherModal && typeof window.renderTeacherModal === "function") window.renderTeacherModal();
        }, (err) => console.warn(err));
      },
      saveTeacherSettings: async function (pin, strictRoster) {
        if (!this.ready || !this.user || !this.db) return false;
        const settingsRef = doc(this.db, "artifacts", this.appId, "public", "data", "settings", "teacherConfig");
        await setDoc(settingsRef, { pin: String(pin), strictRoster, updatedAt: Date.now() }, { merge: true });
        return true;
      },
      fetchTeacherSettingsOnce: async function () {
        if (!this.ready || !this.user || !this.db) return null;
        try {
          const settingsRef = doc(this.db, "artifacts", this.appId, "public", "data", "settings", "teacherConfig");
          const snap = await getDoc(settingsRef);
          if (snap.exists() && window.state) {
            const data = snap.data();
            if (data.pin) window.state.teacherPin = String(data.pin);
            if (typeof data.strictRoster === "boolean") window.state.strictRosterOnly = data.strictRoster;
            if (typeof window.saveTeacherLocalBackup === "function") window.saveTeacherLocalBackup();
            return data;
          }
          return null;
        } catch (e) {
          return null;
        }
      },
      resetAllStudentProgressInCloud: async function (codesList) {
        if (!this.ready || !this.user || !this.db) return false;
        try {
          for (const code of codesList) {
            const ref = doc(this.db, "artifacts", this.appId, "public", "data", "studentProgress", code);
            await deleteDoc(ref);
          }
          return true;
        } catch (e) {
          console.warn(e);
          return false;
        }
      },
      upsertStudentRoster: async function (code, name) {
        if (!this.ready || !this.user || !this.db) return;
        const ref = doc(this.db, "artifacts", this.appId, "public", "data", "roster", code);
        await setDoc(ref, { code, name: name || "", updatedAt: Date.now() }, { merge: true });
      },
      removeStudentRoster: async function (code) {
        if (!this.ready || !this.user || !this.db) return;
        const ref = doc(this.db, "artifacts", this.appId, "public", "data", "roster", code);
        await deleteDoc(ref);
      },
      saveStudentProgress: async function (payload) {
        if (!this.ready || !this.user || !this.db || !payload.code) return;
        const ref = doc(this.db, "artifacts", this.appId, "public", "data", "studentProgress", payload.code);
        await setDoc(ref, payload, { merge: true });
      },
      fetchStudentProgressOnce: async function (code) {
        if (!this.ready || !this.user || !this.db || !code) return null;
        try {
          const ref = doc(this.db, "artifacts", this.appId, "public", "data", "studentProgress", code);
          const snap = await getDoc(ref);
          return snap.exists() ? snap.data() : null;
        } catch (e) {
          return null;
        }
      }
    };

    window.addEventListener("DOMContentLoaded", () => {
      window.CloudSync.init();
    });
  </script>

          <circle cx="60" cy="64" r="46" fill="#fff0f5"/>

          <ellipse cx="60" cy="68" rx="34" ry="29" fill="#ffe08a" stroke="#6b4f1d" stroke-width="3"/>
          <circle cx="46" cy="64" r="4.2" fill="#2d3436"/>

    /* ==========================================================================
       2. 音效與性別分聲道英語語音朗讀系統 (Web Audio API + Web Speech API)
       ========================================================================== */
    let isMuted = false;
    let audioCtx = null;
    let cachedVoices = [];

    function loadSystemVoices() {
      try {
        if ("speechSynthesis" in window) {
          cachedVoices = window.speechSynthesis.getVoices() || [];
        }
      } catch (e) {
        cachedVoices = [];
      }
    }

    if ("speechSynthesis" in window) {
      loadSystemVoices();
      window.speechSynthesis.onvoiceschanged = loadSystemVoices;
    }

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playTone(type) {
      if (isMuted) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "click") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(520, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === "correct") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.09);
          osc.frequency.setValueAtTime(783.99, now + 0.18);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === "wrong") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.setValueAtTime(260, now + 0.12);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === "fanfare") {
          osc.type = "triangle";
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            osc.frequency.setValueAtTime(freq, now + idx * 0.11);
          });
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.55);
        }
      } catch (e) {}
    }

    function pickVoiceByGender(gender) {
      if (!cachedVoices.length) loadSystemVoices();
      const enVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
      if (!enVoices.length) return null;

      const femaleKeywords = ["samantha", "victoria", "karen", "moira", "tessa", "zira", "jenny", "aria", "ava", "allison", "susan", "female", "woman", "girl", "google us english"];
      const maleKeywords = ["alex", "daniel", "fred", "tom", "oliver", "david", "mark", "guy", "christopher", "aaron", "arthur", "male", "man", "boy"];

      const targetKeywords = gender === "male" ? maleKeywords : femaleKeywords;

      let matched = enVoices.find(v =>
        v.lang.toLowerCase().includes("us") &&
        targetKeywords.some(kw => v.name.toLowerCase().includes(kw))
      );

      if (!matched) {
        matched = enVoices.find(v =>
          targetKeywords.some(kw => v.name.toLowerCase().includes(kw))
        );
      }

      if (!matched && gender === "male") {
        matched = enVoices.find(v => !femaleKeywords.some(kw => v.name.toLowerCase().includes(kw)));
      }

      return matched || enVoices[0];
    }

    function speakEnglish(text, gender = "auto") {
      if (isMuted) return;
      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = "en-US";
          utter.rate = 0.88;

          let resolvedGender = gender;
          if (resolvedGender === "auto") {
            const lower = text.toLowerCase();
            if (/\b(tom|ben|he|he's|his)\b/.test(lower)) {
              resolvedGender = "male";
            } else if (/\b(amy|mia|lily|she|she's|her)\b/.test(lower)) {
              resolvedGender = "female";
            } else {
              const detective = DETECTIVES.find(d => d.id === state.avatar);
              resolvedGender = detective ? detective.gender : "female";
            }
          }

          const chosenVoice = pickVoiceByGender(resolvedGender);
          if (chosenVoice) {
            utter.voice = chosenVoice;
          }

          utter.pitch = resolvedGender === "male" ? 0.86 : 1.14;
          window.speechSynthesis.speak(utter);
        }
      } catch (e) {}
    }

    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById("btnSoundToggle");
      btn.textContent = isMuted ? "🔇 靜音中" : "🔊 音效開";
      if (!isMuted) playTone("click");
    }

    /* ==========================================================================
       3. 瀏覽器 Web Speech API 與口說估算評分引擎 (Speech Recognition & Scoring)
       - 優先使用 window.SpeechRecognition，兼容 window.webkitSpeechRecognition
       - lang = "en-US", continuous = false, interimResults = true
       ========================================================================== */
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    const isSpeechRecognitionSupported = !!SpeechRecognitionAPI;

    let activeRecognition = null;
    let recSessionToken = 0;

    // 英文文字正規化（忽略大小寫、標點、多餘空格，並統一常見縮寫與數字）
    function normalizeEnglishText(raw) {
      if (!raw) return "";
      let s = raw.toLowerCase();
      s = s.replace(/[’‘`]/g, "'");
      const contractions = [
        [/\bi'm\b/g, "i am"],
        [/\bwhat's\b/g, "what is"],
        [/\bit's\b/g, "it is"],
        [/\bshe's\b/g, "she is"],
        [/\bhe's\b/g, "he is"],
        [/\bthat's\b/g, "that is"],
        [/\bmy name's\b/g, "my name is"],
        [/\byou're\b/g, "you are"],
        [/\b8\b/g, "eight"],
        [/\b9\b/g, "nine"],
        [/\b10\b/g, "ten"]
      ];
      contractions.forEach(([pattern, replacement]) => {
        s = s.replace(pattern, replacement);
      });
      s = s.replace(/[^a-z0-9\s]/g, " ");
      s = s.replace(/\s+/g, " ").trim();
      return s;
    }

    // Levenshtein 編輯距離演算法
    function levenshteinDistance(a, b) {
      const m = a.length;
      const n = b.length;
      if (m === 0) return n;
      if (n === 0) return m;

      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;

      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    // 單字層級編輯距離
    function wordLevenshteinDistance(wordsA, wordsB) {
      const m = wordsA.length;
      const n = wordsB.length;
      if (m === 0) return n;
      if (n === 0) return m;

      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;

      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = wordsA[i - 1] === wordsB[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[m][n];
    }

    /**
     * 估算評分計算核心 (完全依據實際辨識文字與真實語音時間計算，絕不隨機給分)
     * 1. 句子符合度：60 分
     * 2. 句子完整度：25 分
     * 3. 流暢度估算：15 分 (僅在有可靠語音時間資訊時提供，否則標示「目前無法估算」)
     */
    function evaluateSpeakingAttempt(targetEn, spokenRaw, speechDurationMs) {
      const normTarget = normalizeEnglishText(targetEn);
      const normSpoken = normalizeEnglishText(spokenRaw);

      const targetWords = normTarget ? normTarget.split(" ") : [];
      const spokenWords = normSpoken ? normSpoken.split(" ") : [];

      if (!normSpoken || spokenWords.length === 0) {
        return {
          hasValidSpeech: false,
          errorMessage: "沒有偵測到清晰的英語語音，請靠近麥克風再試一次。"
        };
      }

      // 1. 句子符合度 (滿分 60 分)：結合字元與單字編輯距離相似度
      const maxCharLen = Math.max(normTarget.length, normSpoken.length);
      const charDist = levenshteinDistance(normTarget, normSpoken);
      const charSim = maxCharLen > 0 ? Math.max(0, 1 - charDist / maxCharLen) : 0;

      const maxWordLen = Math.max(targetWords.length, spokenWords.length);
      const wordDist = wordLevenshteinDistance(targetWords, spokenWords);
      const wordSim = maxWordLen > 0 ? Math.max(0, 1 - wordDist / maxWordLen) : 0;

      const combinedSim = charSim * 0.55 + wordSim * 0.45;
      const accuracyScore = Math.round(combinedSim * 60);

      // 2. 句子完整度 (滿分 25 分)：檢查標準句中的每個單字是否被念出，以及是否漏字
      const remainingSpoken = [...spokenWords];
      const missingWords = [];
      let matchedWordCount = 0;

      targetWords.forEach(tw => {
        const foundIdx = remainingSpoken.indexOf(tw);
        if (foundIdx !== -1) {
          matchedWordCount += 1;
          remainingSpoken.splice(foundIdx, 1);
        } else {
          missingWords.push(tw);
        }
      });

      const coverageRatio = targetWords.length > 0 ? matchedWordCount / targetWords.length : 0;
      const completenessScore = Math.round(coverageRatio * 25);

      // 3. 流暢度估算 (滿分 15 分)
      // 僅在取得真實語音起訖時間 (onspeechstart -> onspeechend) 且有效字數 >= 2 時才估算
      let fluencyAvailable = false;
      let fluencyScore = null;
      let fluencyText = "目前無法估算";

      if (
        typeof speechDurationMs === "number" &&
        speechDurationMs >= 350 &&
        speechDurationMs <= 20000 &&
        spokenWords.length >= 2
      ) {
        const durationSec = speechDurationMs / 1000;
        const wps = spokenWords.length / durationSec;
        if (wps >= 0.4 && wps <= 5.5) {
          fluencyAvailable = true;
          let paceFactor = 1.0;
          if (wps < 0.9) {
            paceFactor = Math.max(0.5, wps / 0.9);
          } else if (wps > 3.2) {
            paceFactor = Math.max(0.6, 1 - (wps - 3.2) / 3.5);
          }
          const rawFluency = 15 * paceFactor * Math.max(0.4, coverageRatio);
          fluencyScore = Math.round(Math.min(15, Math.max(0, rawFluency)));
          fluencyText = `${fluencyScore} / 15 分`;
        }
      }

      // 計算總分與百分比換算
      let finalPercentScore = 0;
      let isPartialAssessment = false;

      if (fluencyAvailable && fluencyScore !== null) {
        finalPercentScore = Math.min(100, accuracyScore + completenessScore + fluencyScore);
        isPartialAssessment = false;
      } else {
        // 若流暢度無法估算，依照可評估的 85 分 (60 + 25) 重新換算百分比，不可當成 0 分或補分
        const evaluableEarned = accuracyScore + completenessScore;
        finalPercentScore = Math.min(100, Math.round((evaluableEarned / 85) * 100));
        isPartialAssessment = true;
      }

      // 評分等級與口說練習星星獎勵 (與原本 26 顆遊戲星星分開)
      let gradeLabel = "Let's Try Again!";
      let gradeColor = "var(--pink-dark)";
      let gradeBg = "var(--pink-soft)";
      let speakingStars = 0;

      if (finalPercentScore >= 90) {
        gradeLabel = "Excellent!";
        gradeColor = "#135740";
        gradeBg = "var(--mint-soft)";
        speakingStars = 3;
      } else if (finalPercentScore >= 80) {
        gradeLabel = "Great Job!";
        gradeColor = "var(--blue-dark)";
        gradeBg = "var(--blue-soft)";
        speakingStars = 2;
      } else if (finalPercentScore >= 70) {
        gradeLabel = "Good!";
        gradeColor = "#7c5300";
        gradeBg = "var(--yellow-soft)";
        speakingStars = 1;
      } else if (finalPercentScore >= 60) {
        gradeLabel = "Keep Practicing!";
        gradeColor = "#8a4b00";
        gradeBg = "#fff1db";
        speakingStars = 0;
      } else {
        gradeLabel = "Let's Try Again!";
        gradeColor = "var(--pink-dark)";
        gradeBg = "var(--pink-soft)";
        speakingStars = 0;
      }

      // 產生具體且鼓勵性的學習回饋
      let feedbackTips = [];
      if (missingWords.length > 0) {
        const displayMissing = missingWords.map(w => (w === "i" ? "I" : w));
        if (missingWords.includes("an")) {
          feedbackTips.push(`🔎 提醒：好像漏掉了關鍵字「an」（例如 an eraser），再念一次會更完整喔！`);
        } else if (missingWords.includes("a")) {
          feedbackTips.push(`🔎 提醒：好像漏掉了冠詞「a」，記得把句子念完整喔！`);
        } else {
          feedbackTips.push(`🔎 提醒：好像漏掉了單字「${displayMissing.join(", ")}」，試著把整句都念出來！`);
        }
      } else if (spokenWords.length < targetWords.length) {
        feedbackTips.push(`🔎 提醒：好像只念出了部分句子，試著從頭到尾完整念一遍吧！`);
      }

      if (finalPercentScore >= 90) {
        feedbackTips.unshift("🌟 太棒了！你的句子非常完整又清晰，繼續保持！");
      } else if (finalPercentScore >= 80) {
        feedbackTips.unshift("👏 念得很好喔！再多練習一次就能挑戰最高分！");
      } else if (finalPercentScore >= 70) {
        feedbackTips.unshift("👍 不錯喔！可以先按「聽示範發音」對照一下每個單字，再挑戰一次！");
      } else if (finalPercentScore >= 60) {
        feedbackTips.unshift("💪 已經念出大部分內容了，放慢速度把每個字念清楚，一定會更棒！");
      } else {
        feedbackTips.unshift("🌱 沒關係，先按「🔊 聽示範發音」跟著念一遍，再按「🎙️ 開始錄音」重新挑戰！");
      }

      return {
        hasValidSpeech: true,
        targetEn,
        spokenRaw,
        accuracyScore,
        completenessScore,
        fluencyAvailable,
        fluencyScore,
        fluencyText,
        finalPercentScore,
        isPartialAssessment,
        gradeLabel,
        gradeColor,
        gradeBg,
        speakingStars,
        feedbackTips
      };
    }

    function stopActiveRecognition(silent = true) {
      recSessionToken += 1;
      try {
        if (activeRecognition) {
          if (silent) {
            activeRecognition.onresult = null;
            activeRecognition.onerror = null;
            activeRecognition.onend = null;
            activeRecognition.onspeechstart = null;
            activeRecognition.onspeechend = null;
          }
          activeRecognition.abort();
          activeRecognition = null;
        }
      } catch (e) {
        activeRecognition = null;
      }
    }

    // 統一啟動語音辨識（供關卡口說練習與最終自我介紹舞台共用）
    function beginSpeechSession({ targetEn, onInterim, onFinalEvaluated, onError, onStateChange }) {
      stopActiveRecognition(true);

      if (!isSpeechRecognitionSupported) {
        onError("目前使用的瀏覽器不支援語音辨識，請改用支援的瀏覽器，或使用下方的自行練習模式。");
        return;
      }

      const currentToken = ++recSessionToken;
      let finalTranscript = "";
      let latestInterim = "";
      let speechStartTime = null;
      let speechEndTime = null;
      let hasSettled = false;

      try {
        const recognition = new SpeechRecognitionAPI();
        activeRecognition = recognition;
        recognition.lang = "en-US";
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = function () {
          if (currentToken !== recSessionToken) return;
          onStateChange(true);
        };

        recognition.onspeechstart = function () {
          if (currentToken !== recSessionToken) return;
          speechStartTime = performance.now();
        };

        recognition.onspeechend = function () {
          if (currentToken !== recSessionToken) return;
          if (speechStartTime !== null) {
            speechEndTime = performance.now();
          }
        };

        recognition.onresult = function (event) {
          if (currentToken !== recSessionToken) return;
          let interim = "";
          let finals = "";
          for (let i = 0; i < event.results.length; i++) {
            const res = event.results[i];
            if (res.isFinal) {
              finals += res[0].transcript + " ";
            } else {
              interim += res[0].transcript;
            }
          }
          if (finals.trim()) {
            finalTranscript = finals.trim();
          }
          latestInterim = interim.trim();
          onInterim(finalTranscript || latestInterim);
        };

        recognition.onerror = function (event) {
          if (currentToken !== recSessionToken || hasSettled) return;
          hasSettled = true;
          activeRecognition = null;
          onStateChange(false);

          let msg = "語音辨識失敗，請再試一次。";
          if (event.error === "not-allowed" || event.error === "service-not-allowed") {
            msg = "🚫 麥克風權限遭拒絕。請在瀏覽器網址列或系統設定中允許使用麥克風，然後再點一次「開始錄音」。";
          } else if (event.error === "no-speech") {
            msg = "🔇 沒有聽到聲音喔！請靠近麥克風大聲朗讀英文句子，再試一次。";
          } else if (event.error === "audio-capture") {
            msg = "🎙️ 找不到可用的麥克風裝置，請確認麥克風已連接後再試一次。";
          } else if (event.error === "network") {
            msg = "🌐 語音辨識連線暫時中斷，請確認網路連線後再試一次（或使用下方自行練習模式）。";
          }
          onError(msg);
        };

        recognition.onend = function () {
          if (currentToken !== recSessionToken || hasSettled) return;
          hasSettled = true;
          activeRecognition = null;
          onStateChange(false);

          const rawText = (finalTranscript || latestInterim).trim();
          if (!rawText) {
            onError("🔇 沒有辨識到語音內容，請按下「🎙️ 開始錄音」並大聲朗讀句子再試一次。");
            return;
          }

          let durationMs = null;
          if (speechStartTime !== null) {
            const endTs = speechEndTime !== null ? speechEndTime : performance.now();
            durationMs = endTs - speechStartTime;
          }

          const evalResult = evaluateSpeakingAttempt(targetEn, rawText, durationMs);
          if (!evalResult.hasValidSpeech) {
            onError(evalResult.errorMessage);
          } else {
            onFinalEvaluated(evalResult);
          }
        };

        recognition.start();
      } catch (e) {
        activeRecognition = null;
        onStateChange(false);
        onError("無法啟動麥克風語音辨識，請確認瀏覽器權限或使用下方的自行練習模式。");
      }
    }

    function stopCurrentRecordingByUser() {
      try {
        if (activeRecognition) {
          activeRecognition.stop();
        }
      } catch (e) {}
    }

    // Fisher-Yates 隨機洗牌工具函式（防止學生背答案位置）
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /* ==========================================================================
       6. 畫面渲染核心 (Render Engine)
       ========================================================================== */
    function render() {
      updateTopbar();
      const app = document.getElementById("app");

      if (state.screen === "locked" || state.screen === "expired") {
        app.innerHTML = renderLockedOrExpiredScreen(state.screen === "expired");
      } else if (state.screen === "start") {
        app.innerHTML = renderStartScreen();
      } else if (state.screen === "hub") {
        app.innerHTML = renderHubScreen();
      } else if (state.screen === "mission") {
        app.innerHTML = renderMissionScreen();
      } else if (state.screen === "missionComplete") {
        app.innerHTML = renderMissionCompleteScreen();
      } else if (state.screen === "final") {
        app.innerHTML = renderFinalIntroScreen();
      }
      renderTeacherModal();
    }

    function updateTopbar() {
      document.getElementById("starCounter").textContent = `⭐ ${state.stars} / 26`;
      document.getElementById("speakingStarCounter").textContent = `🎙️ 口說星：${state.speakingStarsTotal}`;
      const hubBtn = document.getElementById("btnHubNav");
      const studentPill = document.getElementById("studentBadgePill");
      const teacherBtn = document.getElementById("btnTeacherQR");

      // 安全性修復：學生透過 QR Code 進入或已登入學生座號時，隱藏頂部「教師管理」按鈕
      if (teacherBtn) {
        if (state.isStudentSession || state.currentStudent) {
          teacherBtn.classList.add("hidden");
        } else {
          teacherBtn.classList.remove("hidden");
        }
      }

      if (state.currentStudent && state.screen !== "locked" && state.screen !== "expired") {
        studentPill.classList.remove("hidden");
        const classLabel = formatFiveDigitClassSeat(state.currentStudent.code);
        studentPill.textContent = `🎒 ${state.currentStudent.code} (${classLabel})${state.currentStudent.name ? " " + state.currentStudent.name : ""}`;
      } else {
        studentPill.classList.add("hidden");
      }

      if (state.screen === "start" || state.screen === "locked" || state.screen === "expired") {
        hubBtn.classList.add("hidden");
      } else {
        hubBtn.classList.remove("hidden");
      }
      updateClassTimerUI();
    }

    // 解析五碼學號（例如 30105 -> 301班 05號）
    function formatFiveDigitClassSeat(code) {
      if (!/^\d{5}$/.test(code)) return code;
      const cls = code.slice(0, 3);
      const seat = code.slice(3, 5);
      return `${cls}班${seat}號`;
    }

    // --------------------------------------------------------------------------
    // 預設門禁鎖定 ＋ 課堂限時 QR Code 入口產生器 ＋ 班級名單與成績系統
    // --------------------------------------------------------------------------
    const LOCAL_STORAGE_KEY = "stationery_detective_teacher_data_v1";

    function saveTeacherLocalBackup() {
      try {
        const data = {
          teacherPin: state.teacherPin,
          strictRosterOnly: state.strictRosterOnly,
          rosterList: state.rosterList,
          progressMap: state.progressMap
        };
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        // 忽略無痕模式或受限 iframe 的儲存錯誤
      }
    }

    function loadTeacherLocalBackup() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data && typeof data === "object") {
          if (typeof data.teacherPin === "string" && data.teacherPin.length >= 4) {
            state.teacherPin = data.teacherPin;
          }
          if (typeof data.strictRosterOnly === "boolean") {
            state.strictRosterOnly = data.strictRosterOnly;
          }
          if (Array.isArray(data.rosterList)) {
            state.rosterList = data.rosterList;
          }
          if (data.progressMap && typeof data.progressMap === "object") {
            state.progressMap = data.progressMap;
          }
        }
      } catch (e) {
        // 忽略讀取錯誤
      }
    }

    let classTimerInterval = null;
    const usedSessionTokens = new Set();

    function initAccessControlFromURL() {
      loadTeacherLocalBackup();
      const params = new URLSearchParams(window.location.search);
      const expParam = params.get("exp");
      const tokenParam = params.get("tid");
      const fbParam = params.get("fb");

      // 若 QR Code 網址中帶有雲端資料庫設定參數，學生手機掃描時自動綁定雲端！
      if (fbParam) {
        try {
          const decodedFb = JSON.parse(atob(fbParam));
          if (decodedFb && decodedFb.apiKey && decodedFb.projectId) {
            localStorage.setItem("stationery_detective_custom_fb_config_v1", JSON.stringify(decodedFb));
            if (window.CloudSync) {
              window.CloudSync.init(decodedFb);
            }
          }
        } catch (e) {}
      }

      // 預設填入目前頁面乾淨網址（去除舊查詢參數）
      const cleanUrl = window.location.origin && window.location.origin !== "null"
        ? `${window.location.origin}${window.location.pathname}`
        : window.location.href.split("?")[0];
      state.teacherBaseUrl = cleanUrl.startsWith("http") ? cleanUrl : "";

      // 預設一律鎖定（平板直接開瀏覽器、點書籤或歷史紀錄都無法進入）
      if (!expParam) {
        state.accessExpiresAt = null;
        state.screen = "locked";
        return;
      }

      const expMs = parseInt(expParam, 10);
      if (isNaN(expMs) || Date.now() > expMs) {
        state.screen = "expired";
        return;
      }

      // 若開啟嚴格模式（tid 參數存在），同分頁重整或重新開啟即判定失效
      if (tokenParam) {
        if (usedSessionTokens.has(tokenParam)) {
          state.screen = "expired";
          return;
        }
        usedSessionTokens.add(tokenParam);
        // 清除網址列上的 tid，避免學生重新整理或複製網址重開
        try {
          const cleanDisplayUrl = `${window.location.pathname}?exp=${expMs}&used=1`;
          window.history.replaceState({}, "", cleanDisplayUrl);
        } catch (e) {}
      }

      if (params.get("used") === "1") {
        state.screen = "expired";
        return;
      }

      state.isStudentSession = true;
      state.accessExpiresAt = expMs;
      state.screen = "start";
      startClassCountdownTimer();
    }

    function startClassCountdownTimer() {
      if (classTimerInterval) clearInterval(classTimerInterval);
      classTimerInterval = setInterval(() => {
        if (!state.accessExpiresAt) return;
        const remainMs = state.accessExpiresAt - Date.now();
        if (remainMs <= 0) {
          clearInterval(classTimerInterval);
          stopActiveRecognition(true);
          state.currentStudent = null;
          state.screen = "expired";
          render();
        } else {
          updateClassTimerUI();
        }
      }, 1000);
    }

    function updateClassTimerUI() {
      const timerPill = document.getElementById("classTimerPill");
      if (!timerPill) return;
      if (!state.accessExpiresAt || state.screen === "locked" || state.screen === "expired") {
        timerPill.classList.add("hidden");
        return;
      }
      const remainMs = Math.max(0, state.accessExpiresAt - Date.now());
      const totalSec = Math.floor(remainMs / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      const formatted = `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;

      timerPill.classList.remove("hidden");
      timerPill.textContent = `⏳ 剩餘 ${formatted}`;
      if (mins < 3) {
        timerPill.classList.add("warning");
      } else {
        timerPill.classList.remove("warning");
      }
    }

    async function openTeacherModal() {
      // 若為學生端模式，禁止開啟教師管理彈窗
      if (state.isStudentSession || state.currentStudent) return;
      playTone("click");
      state.showTeacherModal = true;
      state.teacherPinInput = "";
      state.teacherPinError = "";
      state.teacherCopiedMsg = false;
      state.confirmResetAllProgress = false;
      state.teacherPinLoading = true;
      renderTeacherModal();

      // 強制從 Firebase 雲端抓取最新密碼，避免手機端使用舊預設密碼 1234 登入
      if (window.CloudSync && window.CloudSync.ready) {
        await window.CloudSync.fetchTeacherSettingsOnce();
      }
      state.teacherPinLoading = false;
      renderTeacherModal();
    }

    function closeTeacherModal() {
      playTone("click");
      state.showTeacherModal = false;
      state.confirmResetAllProgress = false;
      renderTeacherModal();
    }

    function verifyTeacherPin() {
      if (state.teacherPinInput === state.teacherPin) {
        playTone("correct");
        state.teacherUnlocked = true;
        state.teacherPinError = "";
        if (!state.teacherGeneratedUrl && state.teacherBaseUrl) {
          generateTeacherQRLink();
        }
        renderTeacherModal();
      } else {
        playTone("wrong");
        state.teacherPinError = "❌ 密碼錯誤，請重新輸入！";
        renderTeacherModal();
      }
    }

    function switchTeacherTab(tab) {
      playTone("click");
      state.teacherModalTab = tab;
      state.confirmResetAllProgress = false;
      renderTeacherModal();
    }

    function generateTeacherQRLink() {
      const base = (state.teacherBaseUrl || "").trim();
      if (!base || !base.startsWith("http")) {
        state.teacherGeneratedUrl = "";
        renderTeacherModal();
        return;
      }
      const cleanBase = base.split("?")[0];
      const expMs = Date.now() + Number(state.teacherDurationMin || 45) * 60 * 1000;
      const params = new URLSearchParams();
      params.set("exp", String(expMs));
      if (state.teacherSingleUse) {
        const randToken = Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
        params.set("tid", randToken);
      }
      // 自動把自訂 Firebase 設定帶入 QR Code，讓學生平板掃碼即自動連線同步
      if (window.CloudSync) {
        const savedFb = window.CloudSync.getSavedCustomConfig();
        if (savedFb) {
          try {
            params.set("fb", btoa(JSON.stringify(savedFb)));
          } catch (e) {}
        }
      }
      state.teacherGeneratedUrl = `${cleanBase}?${params.toString()}`;
      state.teacherCopiedMsg = false;
      renderTeacherModal();
    }

    function copyTeacherLink() {
      if (!state.teacherGeneratedUrl) return;
      const tempInput = document.createElement("input");
      tempInput.value = state.teacherGeneratedUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand("copy");
        state.teacherCopiedMsg = true;
        playTone("correct");
      } catch (e) {}
      document.body.removeChild(tempInput);
      renderTeacherModal();
    }

    function teacherDirectUnlockHere() {
      playTone("correct");
      const expMs = Date.now() + Number(state.teacherDurationMin || 45) * 60 * 1000;
      state.accessExpiresAt = expMs;
      state.showTeacherModal = false;
      state.screen = "start";
      startClassCountdownTimer();
      render();
    }

    // 教師後台：班級名單管理（新增、單筆刪除、批次匯入）
    // --------------------------------------------------------------------------
    async function addSingleStudentToRoster() {
      const code = (state.newStudentCode || "").trim();
      const name = (state.newStudentName || "").trim();
      if (!/^\d{5}$/.test(code)) {
        state.rosterNoticeMsg = "⚠️ 學號必須是 5 碼數字（例如 30105 代表 301班 05號）！";
        renderTeacherModal();
        return;
      }
      playTone("correct");
      const idx = state.rosterList.findIndex(s => s.code === code);
      if (idx >= 0) {
        state.rosterList[idx].name = name;
      } else {
        state.rosterList.push({ code, name });
        state.rosterList.sort((a, b) => a.code.localeCompare(b.code));
      }
      state.newStudentCode = "";
      state.newStudentName = "";
      state.rosterNoticeMsg = `✅ 已儲存學生 ${code}${name ? " (" + name + ")" : ""}！`;
      saveTeacherLocalBackup();
      if (window.CloudSync && window.CloudSync.ready) {
        await window.CloudSync.upsertStudentRoster(code, name);
      }
      renderTeacherModal();
    }

    async function removeStudentFromRoster(code) {
      playTone("click");
      state.rosterList = state.rosterList.filter(s => s.code !== code);
      delete state.progressMap[code];
      state.rosterNoticeMsg = `🗑️ 已刪除學生 ${code} 的名單與學習紀錄。`;
      saveTeacherLocalBackup();
      if (window.CloudSync && window.CloudSync.ready) {
        await window.CloudSync.removeStudentRoster(code);
        await window.CloudSync.resetAllStudentProgressInCloud([code]);
      }
      renderTeacherModal();
    }

    async function importBulkRoster() {
      const lines = (state.bulkRosterText || "").split(/\r?\n/);
      let addedCount = 0;
      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;
        // 支援 "30101 王小明"、"30101,王小明" 或純 "30101"
        const match = line.match(/^(\d{5})[\s,，\t]*(.*)$/);
        if (match) {
          const code = match[1];
          const name = (match[2] || "").trim();
          const idx = state.rosterList.findIndex(s => s.code === code);
          if (idx >= 0) {
            state.rosterList[idx].name = name;
          } else {
            state.rosterList.push({ code, name });
          }
          addedCount++;
          if (window.CloudSync && window.CloudSync.ready) {
            await window.CloudSync.upsertStudentRoster(code, name);
          }
        }
      }
      state.rosterList.sort((a, b) => a.code.localeCompare(b.code));
      saveTeacherLocalBackup();
      if (addedCount > 0) {
        playTone("correct");
        state.bulkRosterText = "";
        state.rosterNoticeMsg = `✅ 成功匯入 / 更新 ${addedCount} 筆學生資料！`;
      } else {
        playTone("wrong");
        state.rosterNoticeMsg = "⚠️ 未偵測到有效的 5 碼學號格式（請每行一筆，例如：30101 王小明）。";
      }
      renderTeacherModal();
    }

    async function saveTeacherSecuritySettings() {
      const newPin = document.getElementById("newTeacherPinInput")?.value.trim();
      const strictBox = document.getElementById("strictRosterCheckbox");
      const strictVal = strictBox ? strictBox.checked : state.strictRosterOnly;

      if (newPin && !/^\d{4,8}$/.test(newPin)) {
        state.rosterNoticeMsg = "⚠️ 教師密碼請設定 4～8 位數字！";
        renderTeacherModal();
        return;
      }
      if (newPin) {
        state.teacherPin = newPin;
      }
      state.strictRosterOnly = strictVal;
      saveTeacherLocalBackup();
      if (window.CloudSync && window.CloudSync.ready) {
        await window.CloudSync.saveTeacherSettings(state.teacherPin, state.strictRosterOnly);
      }
      playTone("correct");
      state.rosterNoticeMsg = "✅ 教師安全設定與密碼已儲存並同步！";
      renderTeacherModal();
    }

    async function handleSaveCustomFirebaseConfig() {
      const raw = document.getElementById("customFirebaseInput")?.value || "";
      if (!window.CloudSync) return;
      const res = await window.CloudSync.saveCustomConfigAndConnect(raw);
      state.rosterNoticeMsg = res.msg;
      if (res.ok) {
        playTone("correct");
        if (state.teacherGeneratedUrl) generateTeacherQRLink();
      } else {
        playTone("wrong");
      }
      renderTeacherModal();
    }

    async function executeResetAllStudentProgress() {
      playTone("click");
      const allCodes = Array.from(new Set([
        ...state.rosterList.map(s => s.code),
        ...Object.keys(state.progressMap || {})
      ]));
      state.progressMap = {};
      state.confirmResetAllProgress = false;
      state.rosterNoticeMsg = "🗑️ 已一鍵清空全班學習進度與錯題統計（保留班級名單與密碼）。";
      saveTeacherLocalBackup();
      if (window.CloudSync && window.CloudSync.ready && allCodes.length > 0) {
        await window.CloudSync.resetAllStudentProgressInCloud(allCodes);
      }

    }

    // --------------------------------------------------------------------------
    // 學生五碼登入與學習進度自動同步
    // --------------------------------------------------------------------------
    async function loginWithFiveDigitCode() {
      const code = (state.studentCodeInput || "").trim();
      if (!/^\d{5}$/.test(code)) {
        playTone("wrong");
        state.studentLoginError = "⚠️ 請輸入 5 碼數字學號（例如：30105 代表 301班 05號）！";
        render();
        return;
      }

      const foundInRoster = state.rosterList.find(s => s.code === code);
      if (state.strictRosterOnly && !foundInRoster) {
        playTone("wrong");
        state.studentLoginError = "⚠️ 此學號不在老師設定的班級名單中，請確認號碼或舉手告訴老師！";
        render();
        return;
      }

      playTone("correct");
      state.studentLoginError = "";
      state.currentStudent = {
        code,
        name: foundInRoster ? foundInRoster.name : ""
      };

      // 嘗試從雲端或本機恢復該學生的既有進度
      let existingProg = state.progressMap[code] || null;
      if (!existingProg && window.CloudSync && window.CloudSync.ready) {
        existingProg = await window.CloudSync.fetchStudentProgressOnce(code);
      }

      if (existingProg) {
        state.stars = existingProg.stars || 0;
        state.speakingStarsTotal = existingProg.speakingStarsTotal || 0;
        state.completedMissions = existingProg.completedMissions || { 1: false, 2: false, 3: false, 4: false };
        state.missionStars = existingProg.missionStars || { 1: 0, 2: 0, 3: 0, 4: 0 };
        state.wrongCounts = existingProg.wrongCounts || {};
        if (existingProg.avatar) state.avatar = existingProg.avatar;
      } else {
        syncCurrentStudentProgressToCloud();
      }
      render();
    }

    function logoutStudent() {
      playTone("click");
      state.currentStudent = null;
      state.studentCodeInput = "";
      state.studentLoginError = "";
      state.stars = 0;
      state.awardedKeys = {};
      state.wrongCounts = {};
      state.speakingStarsTotal = 0;
      state.speakingBestStarsByLine = {};
      state.completedMissions = { 1: false, 2: false, 3: false, 4: false };
      state.missionStars = { 1: 0, 2: 0, 3: 0, 4: 0 };
      render();
    }

    function syncCurrentStudentProgressToCloud() {
      if (!state.currentStudent || !state.currentStudent.code) return;
      const code = state.currentStudent.code;
      const payload = {
        code,
        name: state.currentStudent.name || "",
        avatar: state.avatar,
        stars: state.stars,
        speakingStarsTotal: state.speakingStarsTotal,
        completedMissions: state.completedMissions,
        missionStars: state.missionStars,
        wrongCounts: state.wrongCounts,
        updatedAt: Date.now()
      };
      state.progressMap[code] = payload;
      saveTeacherLocalBackup();
      if (window.CloudSync && window.CloudSync.ready) {
        window.CloudSync.saveStudentProgress(payload);
      }
    }

    function awardStar(uniqueKey, missionId) {
      if (state.awardedKeys[uniqueKey]) return;
      state.awardedKeys[uniqueKey] = true;
      state.stars = Math.min(26, state.stars + 1);
      if (missionId && state.missionStars[missionId] !== undefined) {
        state.missionStars[missionId] += 1;
      }
      syncCurrentStudentProgressToCloud();
    }

    function recordWrongAttempt(questionId) {
      if (!questionId) return;
      state.wrongCounts[questionId] = (state.wrongCounts[questionId] || 0) + 1;
      syncCurrentStudentProgressToCloud();
    }

    // 口說練習星星更新（取單句最高星等累加，與原本 26 顆星星分開計算）
    function recordSpeakingStars(uniqueLineKey, earnedStars) {
      const prevBest = state.speakingBestStarsByLine[uniqueLineKey] || 0;
      if (earnedStars > prevBest) {
        state.speakingBestStarsByLine[uniqueLineKey] = earnedStars;
        state.speakingStarsTotal += (earnedStars - prevBest);
        syncCurrentStudentProgressToCloud();
      }
    }

    function visitCharacterCard(name, line, gender = "auto") {
      playTone("click");
      speakEnglish(line, gender);
      const key = `${state.currentMission}_char_${name}`;
      if (!state.visitedCards[key]) {
        state.visitedCards[key] = true;
        awardStar(key, state.currentMission);
      }
      render();
    }

    function openMysteryBox() {
      playTone("correct");
      state.boxOpened = true;
      const currentItem = STATIONERY_LIST[state.boxItemIndex];
      speakEnglish(currentItem.sentence, "auto");
      const key = `m3_box_${currentItem.key}`;
      if (!state.visitedCards[key]) {
        state.visitedCards[key] = true;
        awardStar(key, 3);
      }
      render();
    }

    function nextBoxItem() {
      playTone("click");
      if (state.boxItemIndex < STATIONERY_LIST.length - 1) {
        state.boxItemIndex += 1;
        state.boxOpened = false;
        render();
      } else {
        goNextStep();
      }
    }

    function selectMatchLeft(id) {
      if (state.matchState.matchedIds.includes(id)) return;
      playTone("click");
      state.matchState.selectedLeft = id;
      state.matchState.errorPair = null;
      render();
    }

    function selectMatchRight(id, rightText, gender = "auto") {
      if (state.matchState.matchedIds.includes(id)) return;
      speakEnglish(rightText, gender);
      if (!state.matchState.selectedLeft) {
        playTone("click");
        return;
      }
      if (state.matchState.selectedLeft === id) {
        playTone("correct");
        state.matchState.matchedIds.push(id);
        state.matchState.selectedLeft = null;
        state.matchState.errorPair = null;
        awardStar(`m1_match_${id}`, 1);
      } else {
        playTone("wrong");
        recordWrongAttempt("m1_q4");
        state.matchState.errorPair = id;
      }
      render();
    }

    function answerMCQ(selectedIdx) {
      const step = getCurrentStep();
      if (!step) return;
      const isCorrect = selectedIdx === step.correctIndex;
      state.selectedOptionIdx = selectedIdx;
      state.questionAnswered = true;
      state.lastAnswerCorrect = isCorrect;

      if (isCorrect) {
        playTone("correct");
        awardStar(step.id, state.currentMission);
        const chosenText = step.options[selectedIdx];
        speakEnglish(chosenText, step.voiceGender || "auto");
      } else {
        playTone("wrong");
        recordWrongAttempt(step.id);
      }
      render();
    }

    function pickOrderLine(lineText) {
      const emptyIdx = state.orderSlots.findIndex(x => x === null);
      if (emptyIdx === -1) return;
      playTone("click");
      speakEnglish(lineText, "auto");
      state.orderSlots[emptyIdx] = lineText;
      state.orderChecked = false;
      render();
    }

    function clearOrderSlot(slotIdx) {
      if (state.orderSlots[slotIdx] === null) return;
      playTone("click");
      state.orderSlots[slotIdx] = null;
      state.orderChecked = false;
      render();
    }

    function checkDialogueOrder() {
      const step = getCurrentStep();
      if (!step) return;
      state.orderChecked = true;
      const isCorrect = step.correctLines.every((line, idx) => state.orderSlots[idx] === line);
      if (isCorrect) {
        playTone("correct");
        awardStar(step.id, state.currentMission);
      } else {
        playTone("wrong");
        recordWrongAttempt(step.id);
      }
      render();
    }

    // --------------------------------------------------------------------------
    // 關卡口說練習操作 (Speaking Practice Controls)
    // --------------------------------------------------------------------------
    function selectSpeakingLine(idx) {
      stopActiveRecognition(true);
      playTone("click");
      state.speakingLineIdx = idx;
      state.speakingRecording = false;
      state.speakingInterimText = "";
      state.speakingErrorMsg = "";
      render();
    }

    function startMissionSpeaking() {
      const step = getCurrentStep();
      if (!step || step.type !== "speaking_practice") return;
      const lineObj = step.lines[state.speakingLineIdx];
      if (!lineObj) return;

      playTone("click");
      state.speakingErrorMsg = "";
      state.speakingInterimText = "";

      const lineKey = `${step.id}_${state.speakingLineIdx}`;

      beginSpeechSession({
        targetEn: lineObj.en,
        onInterim: (text) => {
          state.speakingInterimText = text;
          render();
        },
        onFinalEvaluated: (evalResult) => {
          state.speakingResultByLine[lineKey] = evalResult;
          recordSpeakingStars(lineKey, evalResult.speakingStars);
          if (evalResult.finalPercentScore >= 70) {
            playTone("correct");
          } else {
            playTone("click");
          }
          render();
        },
        onError: (errMsg) => {
          state.speakingErrorMsg = errMsg;
          playTone("wrong");
          render();
        },
        onStateChange: (isRec) => {
          state.speakingRecording = isRec;
          render();
        }
      });
    }

    function markSpeakingSelfPractice() {
      const step = getCurrentStep();
      if (!step || step.type !== "speaking_practice") return;
      playTone("correct");
      const lineKey = `${step.id}_${state.speakingLineIdx}`;
      state.speakingSelfPracticed[lineKey] = true;
      render();
    }

    // --------------------------------------------------------------------------
    // 導覽與任務切換
    // --------------------------------------------------------------------------
    function getCurrentStep() {
      const m = MISSIONS[state.currentMission];
      if (!m) return null;
      return m.steps[state.stepIndex] || null;
    }

    function startMission(missionId) {
      stopActiveRecognition(true);
      playTone("click");
      state.currentMission = missionId;
      state.stepIndex = 0;
      resetStepTempState();
      state.screen = "mission";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetStepTempState() {
      stopActiveRecognition(true);
      state.matchState = { selectedLeft: null, matchedIds: [], errorPair: null };
      state.boxOpened = false;
      state.boxItemIndex = 0;
      state.orderSlots = [null, null, null, null];
      state.orderChecked = false;
      state.questionAnswered = false;
      state.lastAnswerCorrect = null;
      state.selectedOptionIdx = null;
      state.speakingLineIdx = 0;
      state.speakingRecording = false;
      state.speakingInterimText = "";
      state.speakingErrorMsg = "";
      state.speakingResultByLine = {};
      state.speakingSelfPracticed = {};
    }

    function goNextStep() {
      stopActiveRecognition(true);
      playTone("click");
      const m = MISSIONS[state.currentMission];
      if (state.stepIndex < m.steps.length - 1) {
        state.stepIndex += 1;
        resetStepTempState();
        state.screen = "mission";
      } else {
        state.completedMissions[state.currentMission] = true;
        playTone("fanfare");
        syncCurrentStudentProgressToCloud();
        state.screen = "missionComplete";
      }
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goToHub() {
      stopActiveRecognition(true);
      playTone("click");
      state.screen = "hub";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goToFinalIntro() {
      stopActiveRecognition(true);
      playTone("click");
      state.introStep = 0;
      state.introRecording = false;
      state.introInterimText = "";
      state.introErrorMsg = "";
      state.introEvalResult = null;
      state.introFinished = false;
      state.screen = "final";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderTeacherModal() {
      const root = document.getElementById("teacherModalRoot");
      if (!root) return;
      if (!state.showTeacherModal) {
        root.innerHTML = "";
        return;
      }

      if (!state.teacherUnlocked) {
        root.innerHTML = `
          <div class="teacher-modal-backdrop" onclick="if(event.target===this) closeTeacherModal()">
            <div class="teacher-modal" style="max-width:440px;">
              <h2 style="margin:0 0 8px; color:var(--blue-dark);">👩‍🏫 教師管理驗證</h2>
              <p style="margin:0 0 14px; color:var(--text-muted); font-weight:700;">
                請輸入教師管理密碼以開啟 QR Code、班級名單與成績後台。
              </p>
              ${state.teacherPinLoading ? `
                <div style="padding:14px; font-weight:800; color:var(--blue-dark);">⏳ 正在同步雲端最新教師密碼...</div>
              ` : `
                <input
                  type="password"
                  inputmode="numeric"
                  class="name-input"
                  style="width:200px; font-size:1.25rem; letter-spacing:4px;"
                  placeholder="輸入教師密碼"
                  value="${state.teacherPinInput}"
                  oninput="state.teacherPinInput = this.value"
                  onkeydown="if(event.key==='Enter') verifyTeacherPin()"
                />
                ${state.teacherPinError ? `<div style="color:var(--pink-dark); font-weight:800; margin-top:8px;">${state.teacherPinError}</div>` : ""}
                <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
                  <button class="btn btn-primary" onclick="verifyTeacherPin()">🔓 確認進入</button>
                  <button class="btn btn-outline" onclick="closeTeacherModal()">取消</button>
                </div>
              `}
            </div>
          </div>
        `;

    function renderStartScreen() {
      const selectedDetective = DETECTIVES.find(d => d.id === state.avatar) || DETECTIVES[0];

        return `
          <section class="card hero-banner">
            <div style="font-size:2.3rem;">🔍🎒✏️</div>
            <h1 class="game-title">Stationery Detective 2.0</h1>
            <div class="game-subtitle">My Little School Life｜國小三年級英語互動與口說闖關</div>

            <div class="student-id-box">
              <div style="font-size:1.15rem; font-weight:900; color:var(--blue-dark); margin-bottom:6px;">

              </div>
              <div style="font-size:0.92rem; font-weight:700; color:var(--text-muted); margin-bottom:12px;">

              </div>

                inputmode="numeric"
                maxlength="5"
                class="student-code-input"
                placeholder="30105"
